document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || R) return;
  const act = el.dataset.act, id = el.dataset.id;
  lastAct = act;
  if (act === 'tutNext') { tutAdvance(); return; }
  if (act === 'tutStop') { stopTutorial(); return; }
  if (act === 'tab') nightTab = id;
  else if (act === 'buy') buy(id, +el.dataset.n);
  else if (act === 'fill') usedIngs().forEach(i => {
    const n = Math.max(0, 20 - S.stock[i]);
    let k = Math.min(n, Math.floor(S.money / (ING[i].cost * (S.sale === i ? 0.5 : 1))));
    while (k > 0 && ingCost(i, k) > S.money) k--;
    buy(i, k);
  });
  else if (act === 'claim') {
    const a = ACHS.find(x => x.id === id);
    if (a && !S.ach[id] && a.val() >= a.goal) {
      S.ach[id] = true;
      S.money += achReward(a);
      S.totalEarned += achReward(a);
      toast(`🏆 ${a.name} 달성! +${achReward(a)}`);
    }
  } else if (act === 'up') {
    const c = upCost(id);
    if (S.money >= c && S.up[id] < UPS[id].max()) { S.money -= c; S.up[id]++; toast(`${UPS[id].icon} ${UPS[id].name} 완료!`); }
  } else if (act === 'unlock') {
    const c = MENU[id].cost;
    if (S.money >= c) { S.money -= c; S.unlocked[id] = true; toast(`${ic(MENU[id].icon)} ${MENU[id].name} 판매 시작! 재료를 사두세요`); }
  } else if (act === 'decoBuy') {
    const d = DECOS[id], sl = d && DECO_SLOTS[d.slot];
    if (d && !S.deco.own[id] && S.money >= d.cost && !(sl.shop && S.shop < sl.shop)) {
      S.money -= d.cost; S.deco.own[id] = true; S.deco.on[d.slot] = id;
      const s = decoSet();
      toast(`${d.icon} ${josa(d.name, '을', '를')} 들여놨어요! 꾸밈 점수 +${d.charm}${s ? `<br>🎀 세트 완성: ${s.name} (+${s.bonus})` : ''}`);
    }
  } else if (act === 'decoOn') {
    if (DECOS[id] && S.deco.own[id]) {
      S.deco.on[DECOS[id].slot] = id;
      const s = decoSet();
      toast(`${DECOS[id].icon} ${josa(DECOS[id].name, '으로', '로')} 바꿨어요${s ? `<br>🎀 세트 완성: ${s.name} (+${s.bonus})` : ''}`);
    }
  } else if (act === 'decoOff') {
    if (DECOS[id] && S.deco.on[DECOS[id].slot] === id) delete S.deco.on[DECOS[id].slot];
  } else if (act === 'expand') {
    const nx = SHOPS[S.shop + 1];
    if (nx && S.money >= nx.cost) { S.money -= nx.cost; S.shop++; toast(`${nx.icon} ${josa(nx.name, '으로', '로')} 확장했어요!`); }
  } else if (act === 'start') {
    // 연습 카페의 마지막 단계는 "영업 시작" 버튼을 가리킨다: 누르면 연습을 마친다
    if (sandbox && S.tut === 1) { endSandbox(true); return; }
    const out = emptyIngs();
    if (S.tut === 2 && out.length &&
        !confirm(`⚠️ 재고가 없는 재료가 있어요: ${out.map(i => ING[i].name).join(', ')}

이대로 영업하면 ${josa(blockedMenus().map(k => MENU[k].name).join(', '), '을', '를')} 못 만들어요.
그래도 영업을 시작할까요?`)) {
      nightTab = 'stock';
      renderNight();
      return;
    }
    startDay();
    return;
  }
  else if (act === 'labCup') { if (lab.cup !== id) lab.parts = []; lab.cup = id; }
  else if (act === 'labPart') { if (lab.cup && lab.parts.length < LAB_PARTS) lab.parts.push(id); }
  else if (act === 'labUndo') lab.parts.pop();
  else if (act === 'labClear') lab = { ...lab, cup: null, parts: [] };
  else if (act === 'labEmoji') lab.emoji = id;
  else if (act === 'labMake') labMake();
  else if (act === 'labDel') labDel(id);
  else if (act === 'bet') slotBet = +el.dataset.n;
  else if (act === 'spin') { spinSlot(); return; }
  else if (act === 'ticket') buyTicket();
  else if (act === 'scratch') scratch(+el.dataset.n);
  else if (act === 'storyList') { showStoryList(); return; }
  else if (act === 'replayTut') {
    startSandbox();
    return;
  } else if (act === 'reset') {
    if (!confirm('정말 처음부터 다시 할까요? 저장된 진행이 사라져요.')) return;
    showModeSelect(true);
    return;
  } else if (act === 'logout') {
    logout();
    return;
  } else if (act === 'wipe') {
    if (!confirm(`⚠️ 전체 초기화

${curUser ? `👤 ${curUser} 계정의 ` : ''}저장된 진행, 🏆 30일 챌린지 최고 기록, 튜토리얼 기록이 모두 지워져요.
되돌릴 수 없어요. 계속할까요?`)) return;
    if (!confirm('정말로 모두 지울까요? 마지막 확인이에요.')) return;
    wipeAll();
    return;
  } else if (act === 'restart') {
    showModeSelect(false);
    return;
  } else if (act === 'mode') {
    startNewGame(id);
    return;
  } else if (act === 'modeClose') {
    $('overlay').classList.add('hidden');
    return;
  } else return;
  save();
  renderNight();
  tutTick();
});

document.addEventListener('input', e => {
  if (e.target.id === 'labName') lab.name = e.target.value;
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act="book"], [data-act="bookClose"]');
  if (el) document.body.classList.toggle('book-open', el.dataset.act === 'book');
});

// ---------- 루프 ----------
let last = performance.now(), renderAcc = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (R && !document.hidden) {
    update(dt);
    renderAcc += dt;
    if (R && renderAcc >= 0.1) { renderAcc = 0; renderDay(false); }
  }
  requestAnimationFrame(loop);
}

// ---------- 계정 (로그인 / 로그아웃) ----------
// 서버가 없는 게임이라 계정은 이 브라우저의 localStorage에만 저장된다.
// 비밀번호는 솔트를 섞은 해시로만 보관하지만, 한 기기에서 세이브를 나눠 쓰기 위한 용도이지 강한 보안은 아니다.
let curUser = null;   // null이면 게스트
let authMode = 'login';

function loadAccounts() {
  try { const d = JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '{}'); return d && d.users ? d : { users: {}, legacyClaimed: false }; }
  catch (e) { return { users: {}, legacyClaimed: false }; }
}
function saveAccounts(a) { try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); } catch (e) {} }
function hashPw(pw, salt) {
  // FNV-1a 기반 반복 해시 (외부 라이브러리 없이 동작)
  let str = salt + '|' + pw, out = '';
  for (let round = 0; round < 4; round++) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    out += h.toString(36);
    str = out + '|' + salt + '|' + pw;
  }
  return out;
}
const newSalt = () => Math.floor(Math.random() * 1e9).toString(36) + Date.now().toString(36);
const keyFor = (base, user) => (user ? base + '::' + user : base);

function authMsg(t, cls) { $('authMsg').textContent = t || ''; $('authMsg').className = cls || ''; }
function renderAuth() {
  const acc = loadAccounts(), names = Object.keys(acc.users);
  document.querySelectorAll('#auth .atab').forEach(t => t.classList.toggle('on', t.dataset.mode === authMode));
  $('authPw2Wrap').classList.toggle('hidden', authMode !== 'signup');
  $('authGo').textContent = authMode === 'signup' ? '가입하고 시작' : '로그인';
  $('authPw').setAttribute('autocomplete', authMode === 'signup' ? 'new-password' : 'current-password');
  let hasLegacy = false;
  try { hasLegacy = !!localStorage.getItem(BASE_SAVE_KEY); } catch (e) {}
  $('authSub').innerHTML = authMode === 'signup' && hasLegacy && !acc.legacyClaimed
    ? '지금까지 하던 카페를 이 계정으로 그대로 가져와요.'
    : '계정마다 카페가 따로 저장돼요.<br>이 브라우저(기기)에만 저장돼요.';
  // 아이디에는 < > & " 를 못 쓰게 막아 두어서 그대로 넣어도 안전하다
  $('authUsers').innerHTML = names.length && authMode === 'login'
    ? '저장된 계정<br>' + names.map(n => `<span class="u" data-user="${n}">👤 ${n}</span>`).join('')
    : '';
  authMsg('');
}
function showAuth() {
  $('auth').classList.remove('hidden');
  $('authPw').value = ''; $('authPw2').value = '';
  renderAuth();
  setTimeout(() => (!$('authId').value ? $('authId') : $('authPw')).focus(), 50);
}
function submitAuth() {
  const id = $('authId').value.trim(), pw = $('authPw').value;
  if (id.length < 2 || id.length > 16) return authMsg('아이디는 2~16자로 입력해 주세요.', 'bad');
  if (/[\s<>&"']/.test(id)) return authMsg('아이디에 공백이나 < > & " \' 는 쓸 수 없어요.', 'bad');
  if (pw.length < 4) return authMsg('비밀번호는 4자 이상이어야 해요.', 'bad');
  const acc = loadAccounts(), u = acc.users[id];
  if (authMode === 'signup') {
    if (u) return authMsg('이미 있는 아이디예요. 로그인 탭을 이용해 주세요.', 'bad');
    if ($('authPw2').value !== pw) return authMsg('비밀번호 확인이 일치하지 않아요.', 'bad');
    const salt = newSalt();
    acc.users[id] = { s: salt, h: hashPw(pw, salt), at: Date.now() };
    // 계정 기능 이전의 세이브가 있다면 첫 계정이 이어받는다
    if (!acc.legacyClaimed) {
      try {
        const legacy = localStorage.getItem(BASE_SAVE_KEY), best = localStorage.getItem(BASE_BEST_KEY);
        if (legacy) { localStorage.setItem(keyFor(BASE_SAVE_KEY, id), legacy); acc.legacyClaimed = true; }
        if (legacy && best) localStorage.setItem(keyFor(BASE_BEST_KEY, id), best);
      } catch (e) {}
    }
    saveAccounts(acc);
  } else {
    if (!u) return authMsg('없는 아이디예요. 회원가입 탭에서 만들어 주세요.', 'bad');
    if (hashPw(pw, u.s) !== u.h) return authMsg('비밀번호가 맞지 않아요.', 'bad');
  }
  enterGame(id);
}

function enterGame(user) {
  curUser = user || null;
  SAVE_KEY = keyFor(BASE_SAVE_KEY, curUser);
  BEST_KEY = keyFor(BASE_BEST_KEY, curUser);
  try { curUser ? localStorage.setItem(SESSION_KEY, curUser) : localStorage.removeItem(SESSION_KEY); } catch (e) {}
  $('auth').classList.add('hidden');
  startGame();
  if (curUser) toast(`👋 ${curUser}님, 어서 오세요!`);
}

// 계정이 바뀔 때 이전 사람의 화면 상태가 남지 않게 모두 처음으로 돌린다
function startGame() {
  sandbox = null;
  tut = null; renderCoach();
  story = null; renderStory();
  $('overlay').classList.add('hidden');
  lastSummary = null; nightTab = 'stock'; slotMsg = '';
  S = load();
  if (S) syncCustom();
  if (S) {
    if (!S.quests.length) prepareDay();
    // 예전 기준(최고 기록 × 1.1)으로 잡힌 대결 목표는 새 기준으로 낮춰 준다
    if (S.duel && !S.duelResult) S.duel.target = Math.min(S.duel.target, duelTarget());
    showNight();
    const refund = S.equipRefund; delete S.equipRefund;
    if (refund) { save(); setTimeout(() => toast(`⚙️ 고급 장비가 없어져서 산 값을 돌려드렸어요: +${fmt(refund)}`), 700); }
  } else {
    S = newGame();   // 모드를 고르기 전 화면이 비지 않게
    syncCustom();
    $('nightView').innerHTML = '';
    renderHud();
    renderBg(true);
    showModeSelect(false);
  }
}

// 로그아웃은 밤(준비 화면)에서만 할 수 있다. 밤에는 진행이 항상 저장된 상태다.
function logout() {
  if (R) return;
  save();
  tut = null; renderCoach();
  story = null; renderStory();
  $('overlay').classList.add('hidden');
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  $('authId').value = curUser || '';
  curUser = null;
  authMode = 'login';
  showAuth();
}

document.querySelectorAll('#auth .atab').forEach(t => t.addEventListener('click', () => { authMode = t.dataset.mode; renderAuth(); }));
$('authGo').addEventListener('click', submitAuth);
$('authGuest').addEventListener('click', () => enterGame(null));
$('authUsers').addEventListener('click', e => {
  const u = e.target.closest('[data-user]');
  if (u) { $('authId').value = u.dataset.user; $('authPw').focus(); }
});
['authId', 'authPw', 'authPw2'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); }));

let sess = null;
try { sess = localStorage.getItem(SESSION_KEY); } catch (e) {}
if (sess && loadAccounts().users[sess]) enterGame(sess);   // 지난 로그인 유지
else showAuth();
requestAnimationFrame(loop);
</script>
