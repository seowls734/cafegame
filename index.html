<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>나의 작은 카페</title>
<style>
  :root {
    --bg: #f6ead8;
    --panel: #fffaf2;
    --wood: #8b5a34;
    --wood-dark: #5e3a1f;
    --ink: #3b2614;
    --muted: #8a7360;
    --accent: #e07b39;
    --good: #4f9d4a;
    --warn: #e0a526;
    --bad: #d24b3e;
    --line: #e4d2b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  body.coaching #app { padding-bottom: 150px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .ic { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; font-style: normal; line-height: 1; }

  /* HUD */
  #hud {
    position: sticky; top: 0; z-index: 5;
    background: var(--wood-dark); color: #fff3e2;
    padding: 10px 16px 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .hud-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
  .hud-row .money { font-size: 1.15rem; color: #ffd68a; }
  .clock-bar { margin-top: 6px; height: 6px; background: rgba(255,255,255,.18); border-radius: 3px; overflow: hidden; }
  .clock-bar > div { height: 100%; background: #ffd68a; width: 0; }
  .rep { font-size: .9rem; }

  section { padding: 12px 16px 24px; }
  .hidden { display: none !important; }
  h3 { margin: 14px 0 8px; font-size: .95rem; color: var(--wood); }

  /* Counter / customers */
  .shopname { text-align: center; font-weight: 800; color: var(--wood); margin-bottom: 8px; }
  #counter {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px;
    background: linear-gradient(#fff4e3, #f3dfc2);
    border: 3px solid var(--wood); border-radius: 14px; padding: 10px;
    min-height: 150px;
  }
  .slot {
    border: 2px dashed var(--line); border-radius: 12px; min-height: 128px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--muted); font-size: .8rem; padding: 6px 4px;
  }
  .cust { border-style: solid; border-color: var(--wood); background: var(--panel); color: var(--ink); cursor: pointer; }
  .cust.ready { border-color: var(--good); box-shadow: 0 0 0 3px rgba(79,157,74,.3); }
  .cust.vip { background: #fff3c4; }
  .cust.deliv { background: #e3f1ff; border-color: #4d7f9e; }
  .cust .tag { font-size: .65rem; font-weight: 800; color: #fff; background: #4d7f9e; border-radius: 6px; padding: 1px 6px; }
  .cust .tag.hot { background: var(--accent); }
  .daybar { display: flex; gap: 8px; align-items: stretch; margin-bottom: 8px; }
  #quests { flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: .75rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; }
  #quests .q { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  #quests .q .ic { font-size: 1.2em; }
  #quests .q.ok { color: var(--good); font-weight: 700; }
  #combo { min-width: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: .7rem; color: var(--muted); }
  #combo b { font-size: 1.3rem; color: var(--accent); line-height: 1.1; }
  #combo.hot { background: #fff0e0; border-color: var(--accent); }
  .info-list { font-size: .88rem; line-height: 1.8; }
  .info-list .ic { font-size: 1.3em; vertical-align: -0.3em; }
  .sale-tag { background: var(--bad); color: #fff; font-size: .65rem; font-weight: 800; border-radius: 6px; padding: 1px 5px; margin-left: 4px; }
  .tab { position: relative; }
  .tab .dot { position: absolute; top: -6px; right: -4px; background: var(--bad); color: #fff; font-size: .65rem; border-radius: 9px; padding: 0 5px; line-height: 16px; }
  .ach-done { opacity: .5; }
  .prog { height: 5px; background: #eadbc5; border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .prog > div { height: 100%; background: var(--good); }
  .cust .face { font-size: 2rem; line-height: 1; }
  .bubble { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 3px 6px; font-size: 1.6rem; display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
  .bubble .got { background: #d8f0d2; border-radius: 4px; }
  .bubble small { flex-basis: 100%; font-size: .6rem; color: var(--muted); text-align: center; }
  .pbar { width: 86%; height: 6px; background: #eadbc5; border-radius: 3px; overflow: hidden; }
  .pbar > div { height: 100%; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* Tray */
  .row-title { display: flex; justify-content: space-between; align-items: center; }
  .small-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 3px 8px; font-size: .78rem; }
  #tray {
    min-height: 56px; background: #d9b98f; border: 2px solid var(--wood); border-radius: 12px;
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 6px 8px; font-size: 2rem;
  }
  #tray .empty { font-size: .85rem; color: var(--wood-dark); opacity: .7; }
  .titem { position: relative; line-height: 1; }
  .titem i { position: absolute; right: -4px; bottom: -2px; font-size: .6rem; font-style: normal; }

  /* Workbench */
  #bench { background: var(--panel); border: 3px solid var(--wood); border-radius: 14px; padding: 10px; }
  .build {
    min-height: 58px; border-radius: 10px; background: #f1e3cd; display: flex; align-items: center; gap: 6px;
    padding: 6px 10px 12px; font-size: 1.8rem; flex-wrap: wrap;
  }
  .build .hint { font-size: .85rem; color: var(--muted); }
  .build .plus-sign { font-size: 1rem; color: var(--muted); }
  .build .part { position: relative; line-height: 1; }
  .build .part i { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); font-size: .55rem; font-style: normal; white-space: nowrap; }
  .build.bad { background: #f6d3cc; }
  .build-status { font-size: .85rem; margin: 6px 0 2px; min-height: 1.2em; font-weight: 700; }
  .build-status .ic { font-size: 1.3em; }
  .gauge-wrap { margin: 8px 0; }
  .gauge-wrap .lbl { font-size: .85rem; color: var(--wood-dark); margin-bottom: 4px; font-weight: 700; }
  .gauge { position: relative; height: 28px; background: #e6d6be; border-radius: 14px; overflow: hidden; border: 2px solid var(--wood); }
  .gauge .zone { position: absolute; top: 0; bottom: 0; background: rgba(79,157,74,.5); }
  .gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(139,90,52,.6); }
  .gauge .mark { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--wood-dark); }
  .grp-label { font-size: .75rem; color: var(--muted); margin: 8px 0 4px; }
  .parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 6px; }
  .pbtn {
    background: #fff; border: 2px solid var(--wood); border-radius: 12px; padding: 6px 2px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 3px 0 var(--wood);
    touch-action: none;
  }
  .pbtn:active, .pbtn.active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood); background: #ffe9cf; }
  .pbtn .ico { font-size: 2rem; line-height: 1; }
  .pbtn .nm { font-size: .7rem; font-weight: 700; }
  .pbtn .sub { font-size: .6rem; color: var(--muted); }
  .pbtn.off { opacity: .4; }
  .pbtn.cup { background: #eef5ff; }
  .bench-actions { display: flex; gap: 6px; margin-top: 10px; }
  .bench-actions button { flex: 1; border-radius: 10px; padding: 9px; font-weight: 800; border: 0; }
  .btn-done { background: var(--good); color: #fff; }
  .btn-done:disabled { background: #c9b8a6; }
  .btn-trash { background: #e8d6c0; }

  /* Recipe book */
  details.book { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin-top: 12px; }
  details.book summary { font-weight: 700; color: var(--wood); cursor: pointer; }
  .rec { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: .85rem; border-bottom: 1px dashed var(--line); }
  .rec:last-child { border-bottom: 0; }
  .rec .r { font-size: 1.5rem; display: flex; align-items: center; gap: 2px; }
  .rec .r .op { font-size: .8rem; color: var(--muted); }
  #stockBar { display: flex; flex-wrap: wrap; gap: 6px; font-size: .85rem; }
  .stk { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px 7px; display: flex; align-items: center; gap: 4px; }
  .stk .ic { font-size: 1.3rem; }
  .stk.low { border-color: var(--bad); color: var(--bad); font-weight: 700; }

  /* Night */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 8px; font-size: 1.1rem; }
  .sum { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: .9rem; }
  .sum .v { text-align: right; font-weight: 700; }
  .plus { color: var(--good); } .minus { color: var(--bad); }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs { gap: 4px; }
  .tab { flex: 1; min-width: 0; border: 2px solid var(--wood); background: var(--panel); border-radius: 10px; padding: 8px 0; font-weight: 700; font-size: .74rem; white-space: nowrap; }
  .tab.on { background: var(--wood); color: #fff; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .ico { font-size: 2.2rem; width: 44px; text-align: center; line-height: 1; }
  .item .info { flex: 1; min-width: 0; }
  .item .info b { display: block; }
  .item .info span { font-size: .78rem; color: var(--muted); }
  .item .info .r { font-size: 1.2rem; display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
  .item .info .r .op { font-size: .7rem; }
  .buy {
    border: 0; background: var(--accent); color: #fff; font-weight: 700; border-radius: 10px; padding: 8px 10px; font-size: .8rem; white-space: nowrap;
  }
  .buy:disabled { background: #c9b8a6; }
  .big {
    width: 100%; border: 0; border-radius: 14px; padding: 14px; font-size: 1.1rem; font-weight: 800;
    background: var(--accent); color: #fff; box-shadow: 0 4px 0 #a9541f;
  }
  .big:active { transform: translateY(2px); box-shadow: 0 2px 0 #a9541f; }
  .warn-text { color: var(--bad); font-size: .85rem; font-weight: 700; display: flex; align-items: center; gap: 2px; }
  .warn-text .ic { font-size: 1.3rem; }
  .links { text-align: center; margin-top: 18px; display: flex; justify-content: center; gap: 16px; }
  .reset { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: .8rem; }

  /* Tutorial */
  #coach {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 15;
    width: calc(100% - 24px); max-width: 536px;
    background: #fff; border: 3px solid var(--accent); border-radius: 16px; padding: 10px 12px;
    box-shadow: 0 6px 20px rgba(60,30,10,.3);
    display: flex; gap: 10px; align-items: flex-start;
  }
  #coach .who { font-size: 2.2rem; line-height: 1; }
  #coach .say { flex: 1; font-size: .92rem; line-height: 1.55; }
  #coach .say .ic { font-size: 1.35em; vertical-align: -0.3em; }
  #coach .step { font-size: .7rem; color: var(--muted); }
  #coach button { margin-top: 6px; border: 0; background: var(--accent); color: #fff; font-weight: 800; border-radius: 10px; padding: 7px 14px; }
  .tut-glow { position: relative; z-index: 2; animation: glow 1s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 3px #ffb347, 0 0 14px 4px rgba(255,160,50,.7); }
    50% { box-shadow: 0 0 0 5px #ff8c1a, 0 0 22px 8px rgba(255,140,30,.9); }
  }

  /* Overlay, toast, floats */
  #overlay { position: fixed; inset: 0; background: rgba(40,25,10,.7); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  #overlay .card { max-width: 380px; width: 100%; text-align: center; }
  #toast {
    position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 30;
    background: rgba(40,25,10,.92); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: .9rem;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
  }
  #toast .ic { font-size: 1.3em; vertical-align: -0.3em; }
  #toast.show { opacity: 1; }
  .float { position: fixed; z-index: 25; font-weight: 800; pointer-events: none; animation: floatUp 1s forwards; text-shadow: 0 1px 2px #fff; white-space: nowrap; }
  .float .ic { font-size: 1.4em; vertical-align: -0.3em; }
  @keyframes floatUp { to { transform: translateY(-40px); opacity: 0; } }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-row">
      <span id="hudDay">1일차</span>
      <span class="rep" id="hudRep"></span>
      <span class="money" id="hudMoney"></span>
    </div>
    <div class="clock-bar"><div id="hudClock"></div></div>
  </header>

  <section id="dayView" class="hidden">
    <div class="shopname" id="shopName"></div>
    <div class="daybar"><div id="quests"></div><div id="combo"></div></div>
    <div id="counter"></div>
    <h3 class="row-title"><span>🍽️ 쟁반 <small id="trayCount"></small></span><button class="small-btn" data-act="clearTray">🗑 비우기</button></h3>
    <div id="tray"></div>
    <h3>👨‍🍳 작업대</h3>
    <div id="bench">
      <div class="build" id="build"></div>
      <div class="build-status" id="buildStatus"></div>
      <div class="gauge-wrap hidden" id="gaugeWrap">
        <div class="lbl" id="gaugeLbl"></div>
        <div class="gauge"><div class="zone" id="gaugeZone"></div><div class="fill" id="gaugeFill"></div><div class="mark" id="gaugeMark"></div></div>
      </div>
      <div id="benchBtns"></div>
      <div class="bench-actions">
        <button class="btn-trash" data-act="trash">🗑 버리기</button>
        <button class="btn-done" data-act="done" id="doneBtn">✅ 완성</button>
      </div>
    </div>
    <details class="book" id="book" open><summary>📖 레시피</summary><div id="bookList"></div></details>
    <h3>📦 재고</h3>
    <div id="stockBar"></div>
  </section>

  <section id="nightView" class="hidden"></section>
</div>
<div id="coach" class="hidden"></div>
<div id="overlay" class="hidden"></div>
<div id="toast"></div>

<script>
'use strict';

// ---------- 그림 ----------
// 윈도우 10에서도 깨지지 않는 이모지(Emoji 12 이하, 최신 ZWJ 조합 제외)만 쓴다.
const ICONS = {
  coin: '💰',
  // 메뉴
  americano: '☕', latte: '🥛', choco: '🍫', teaCup: '🍵', iceame: '🥤', icelatte: '🧊',
  smoothie: '🍹', cookie: '🍪', cakeSlice: '🍰', croissant: '🥐',
  // 도구·재료 넣기
  mug: '☕', icecup: '🥤', plate: '🍽️', shot: '🟤', water: '💧', milk: '🍼', ice: '🧊',
  leaf: '🌿', cocoa: '🥄', strawberry: '🍓', blender: '🌀', oven: '🔥',
  // 재료(재고)
  bean: '🌰', cakeWhole: '🎂', dough: '🥖',
};

const ic = key => `<span class="ic">${ICONS[key] || ''}</span>`;

// ---------- 데이터 ----------
const ING = {
  bean:   { name: '원두',   icon: 'bean',       cost: 1 },
  milk:   { name: '우유',   icon: 'milk',       cost: 1 },
  cookie: { name: '쿠키',   icon: 'cookie',     cost: 1 },
  tea:    { name: '찻잎',   icon: 'leaf',       cost: 2 },
  cake:   { name: '케이크', icon: 'cakeWhole',  cost: 4 },
  dough:  { name: '생지',   icon: 'dough',      cost: 2 },
  fruit:  { name: '딸기',   icon: 'strawberry', cost: 3 },
  cocoa:  { name: '코코아', icon: 'cocoa',      cost: 3 },
};

// 작업대 부품. gauge가 있는 부품은 직접 조작해야 하고, 결과에 따라 품질이 매겨진다.
//   hold: 누르고 있는 동안 차오르고, 떼는 순간 판정
//   auto: 한 번 누르면 저절로 차오르고, 다시 눌러서 멈춤
//   mash: 연타해서 끝까지 채우기 (가만히 있으면 줄어듦)
const PARTS = {
  mug:    { name: '머그컵',     icon: 'mug', cup: true },
  icecup: { name: '아이스컵',   icon: 'icecup', cup: true },
  plate:  { name: '접시',       icon: 'plate', cup: true },
  shot:   { name: '샷 추출',    icon: 'shot',  ing: 'bean', gauge: { mode: 'hold', speed: 0.5,  zone: [0.62, 0.78] } },
  water:  { name: '물 붓기',    icon: 'water',              gauge: { mode: 'hold', speed: 0.75, zone: [0.70, 0.86] } },
  milk:   { name: '우유 붓기',  icon: 'milk',  ing: 'milk', gauge: { mode: 'hold', speed: 0.6,  zone: [0.66, 0.82] } },
  ice:    { name: '얼음',       icon: 'ice' },
  tea:    { name: '찻잎',       icon: 'leaf',  ing: 'tea' },
  cocoa:  { name: '코코아',     icon: 'cocoa', ing: 'cocoa' },
  fruit:  { name: '딸기',       icon: 'strawberry', ing: 'fruit' },
  blend:  { name: '블렌더',     icon: 'blender',            gauge: { mode: 'mash' } },
  cookie: { name: '쿠키',       icon: 'cookie', ing: 'cookie' },
  cake:   { name: '케이크',     icon: 'cakeSlice', ing: 'cake' },
  bake:   { name: '생지 굽기',  icon: 'oven',  ing: 'dough', gauge: { mode: 'auto', speed: 0.32, zone: [0.70, 0.84] } },
};

const MENU = {
  americano: { name: '아메리카노',       icon: 'americano', cup: 'mug',    parts: ['shot', 'water'],                 price: 5,  cost: 0,   shop: 0 },
  latte:     { name: '카페라떼',         icon: 'latte',     cup: 'mug',    parts: ['shot', 'milk'],                  price: 7,  cost: 0,   shop: 0 },
  cookie:    { name: '쿠키',             icon: 'cookie',    cup: 'plate',  parts: ['cookie'],                        price: 3,  cost: 0,   shop: 0 },
  iceame:    { name: '아이스아메리카노', icon: 'iceame',    cup: 'icecup', parts: ['ice', 'shot', 'water'],          price: 6,  cost: 40,  shop: 0 },
  tea:       { name: '홍차',             icon: 'teaCup',    cup: 'mug',    parts: ['tea', 'water'],                  price: 6,  cost: 60,  shop: 0 },
  cake:      { name: '조각케이크',       icon: 'cakeSlice', cup: 'plate',  parts: ['cake'],                          price: 10, cost: 100, shop: 0 },
  icelatte:  { name: '아이스라떼',       icon: 'icelatte',  cup: 'icecup', parts: ['ice', 'shot', 'milk'],           price: 8,  cost: 120, shop: 0 },
  croissant: { name: '크루아상',         icon: 'croissant', cup: 'plate',  parts: ['bake'],                          price: 8,  cost: 180, shop: 1 },
  smoothie:  { name: '딸기스무디',       icon: 'smoothie',  cup: 'icecup', parts: ['fruit', 'milk', 'ice', 'blend'], price: 13, cost: 250, shop: 1 },
  choco:     { name: '핫초코',           icon: 'choco',     cup: 'mug',    parts: ['cocoa', 'milk'],                 price: 11, cost: 400, shop: 2 },
};

const SHOPS = [
  { name: '길거리 노점',     icon: '🛒', cost: 0,    priceMult: 1.0, rentMult: 1.0 },
  { name: '동네 카페',       icon: '🏠', cost: 300,  priceMult: 1.2, rentMult: 1.6 },
  { name: '2층 카페',        icon: '🏢', cost: 1000, priceMult: 1.4, rentMult: 2.5 },
  { name: '프랜차이즈 본점', icon: '🏙️', cost: 3500, priceMult: 1.7, rentMult: 4.0 },
];

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    const base = newGame();
    const up = { ...base.up };
    for (const k in up) if (d.up && typeof d.up[k] === 'number') up[k] = d.up[k];
    // 튜토리얼이 생기기 전 저장이면 이미 해본 사람으로 본다
    const tut = typeof d.tut === 'number' ? d.tut : (d.day > 1 ? 2 : 0);
    return { ...base, ...d, tut, stock: { ...base.stock, ...d.stock }, up, unlocked: { ...base.unlocked, ...d.unlocked },
             stats: { ...base.stats, ...d.stats }, ach: { ...d.ach }, quests: Array.isArray(d.quests) ? d.quests : [] };
  } catch (e) { return null; }
}

function makeQuests() {
  const d = S.day;
  const types = Object.keys(QUESTS).filter(t => !(t === 'nolost' && d < 3));
  const picked = [];
  while (picked.length < 3 && types.length) picked.push(types.splice(Math.floor(Math.random() * types.length), 1)[0]);
  return picked.map(type => {
    const q = { type, n: QUESTS[type].n(d), reward: Math.round(QUESTS[type].base * (1 + d * 0.25) * SHOPS[S.shop].priceMult) };
    if (type === 'sell') { const m = unlockedMenu(); q.item = m[Math.floor(Math.random() * m.length)]; }
    return q;
  });
}
const questVal = (q, st, ended) => Math.min(q.n, QUESTS[q.type].val(st, q, ended));

function floatAt(el, html, color) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'float';
  f.innerHTML = html;
  f.style.color = color;
  f.style.left = (r.left + r.width / 2 - 24) + 'px';
  f.style.top = (r.top + 6) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1000);
}

function guideTarget(id) {
  const m = MENU[id];
  if (R.tray.some(t => t.id === id)) return '.cust';
  const b = R.bench;
  const ids = b.parts.map(p => p.id);
  if (b.cup && (b.cup !== m.cup || !isSubset(ids, m.parts))) return '[data-act="trash"]';
  if (R.gauge) return `[data-id="${R.gauge.part}"]`;
  if (!b.cup) return `[data-id="${m.cup}"]`;
  const next = m.parts.find((p, i) => (countOf(ids)[p] || 0) < countOf(m.parts)[p]);
  return next ? `[data-id="${next}"]` : '#doneBtn';
}

function tutStart(steps, onEnd) {
  tut = { steps, i: -1, onEnd };
  tutAdvance();
}

function tutAdvance() {
  if (!tut) return;
  tut.i++;
  const st = tut.steps[tut.i];
  if (!st) {
    const end = tut.onEnd;
    tut = null;
    renderCoach();
    applyHighlight();
    if (end) end();
    return;
  }
  if (st.tab) nightTab = st.tab;
  if (st.setup) st.setup();
  if (!R) renderNight();
  renderCoach();
  applyHighlight();
}

function tutTick() {
  if (!tut) return;
  const st = tut.steps[tut.i];
  if (st && st.done && st.done()) tutAdvance();
  else applyHighlight();
}

function renderCoach() {
  const c = $('coach');
  const st = tut && tut.steps[tut.i];
  document.body.classList.toggle('coaching', !!st);
  if (!st) { c.classList.add('hidden'); return; }
  c.classList.remove('hidden');
  c.innerHTML = `<div class="who">👩‍🍳</div><div class="say">${st.say}
    ${st.next ? `<div><button data-act="tutNext">${st.next}</button></div>` : ''}
    <div class="step">${tut.i + 1} / ${tut.steps.length}</div></div>`;
}

function applyHighlight() {
  document.querySelectorAll('.tut-glow').forEach(e => e.classList.remove('tut-glow'));
  const st = tut && tut.steps[tut.i];
  if (!st || !st.target) { lastTarget = null; return; }
  const sel = typeof st.target === 'function' ? st.target() : st.target;
  const el = document.querySelector(sel);
  if (!el) return;
  el.classList.add('tut-glow');
  if (sel !== lastTarget) {
    lastTarget = sel;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// ---------- 영업(낮) ----------
function startDay() {
  const tutorial = S.tut === 0;
  if (tut) { tut = null; renderCoach(); }
  if (S.tut === 1) { S.tut = 2; save(); }
  R = {
    t: 0, closing: false, tutorial,
    counter: Array(S.up.counter).fill(null),
    tray: [],                       // { id, q }
    bench: { cup: null, parts: [] }, // parts: { id, q }
    gauge: null,
    spawnT: 2, staffT: 0, robotT: 0,
    delivery: null, delivT: 20 + Math.random() * 15,
    combo: 0,
    stats: { served: 0, lost: 0, revenue: 0, tips: 0, wasted: 0, perfect: 0, sold: {}, maxCombo: 0, vip: 0, delivery: 0 },
  };
  $('nightView').classList.add('hidden');
  $('dayView').classList.remove('hidden');
  $('shopName').innerHTML = `${SHOPS[S.shop].icon} ${SHOPS[S.shop].name} — 영업 중${isWeekend() ? ' · 🎉 주말 손님 폭주!' : ''}`;
  $('bookList').innerHTML = unlockedMenu().map(k =>
    `<div class="rec"><span class="r">${ic(MENU[k].icon)}</span><b>${MENU[k].name}${k === S.special ? '<span class="sale-tag">추천 ×1.5</span>' : ''}</b><span style="margin-left:auto">${recipeHtml(k)}</span></div>`).join('');
  $('book').open = S.day <= 3;
  window.scrollTo(0, 0);
  last = performance.now();
  renderBench();
  renderDay(true);
  if (tutorial) {
    // 튜토리얼에 쓸 재료는 넉넉히 채워준다
    S.stock.bean = Math.max(S.stock.bean, 6);
    S.stock.milk = Math.max(S.stock.milk, 3);
    S.stock.cookie = Math.max(S.stock.cookie, 3);
    renderStock();
    tutStart(DAY_TUT, () => {
      R.tutorial = false;
      R.t = 0;
      R.spawnT = 1;
      S.tut = 1;
      toast('☀️ 본격 영업 시작! 화이팅!');
    });
  }
}

function nextSpawn() {
  const rate = (0.6 + S.rep / 100 + S.up.sign * 0.15 + Math.min(S.day, 30) * 0.02 + S.shop * 0.25) * (isWeekend() ? 1.4 : 1);
  return (11 / rate) * (0.6 + Math.random() * 0.8);
}

// 추천 메뉴는 더 자주 주문된다
function randomMenu() {
  const menu = unlockedMenu();
  const bag = menu.concat(menu.includes(S.special) ? [S.special, S.special] : []);
  return bag[Math.floor(Math.random() * bag.length)];
}

function spawn() {
  const idx = R.counter.indexOf(null);
  if (idx < 0) return; // 자리가 없으면 그냥 지나간다
  let size = 1;
  if (Math.random() < Math.min(0.45, 0.05 + S.day * 0.03)) size++;
  if (S.shop >= 2 && Math.random() < 0.15) size++;
  const order = [];
  for (let i = 0; i < size; i++) order.push(randomMenu());
  const vip = Math.random() < 0.08 + S.up.decor * 0.01;
  const max = (26 + 14 * size) * (1 + S.up.decor * 0.12) * (vip ? 0.75 : 1);
  R.counter[idx] = { face: vip ? '😎' : FACES[Math.floor(Math.random() * FACES.length)], order, pat: max, max, vip };
}

// 배달 주문: 메뉴가 많고 오래 기다려 주지만, 배달비를 얹어 준다
function spawnDelivery() {
  const size = 2 + (Math.random() < 0.4 + S.shop * 0.1 ? 1 : 0);
  const order = [];
  for (let i = 0; i < size; i++) order.push(randomMenu());
  const max = (45 + 15 * size) * (1 + S.up.decor * 0.08);
  R.delivery = { face: '🛵', order, pat: max, max, deliv: true };
  toast('🛵 배달 주문이 들어왔어요! 배달비 보너스!');
  renderDay(true);
}

const getCust = i => (i === 'd' ? R.delivery : R.counter[i]);
function clearCust(i) { if (i === 'd') R.delivery = null; else R.counter[i] = null; }
const allCusts = () => (R.delivery ? [[R.delivery, 'd']] : []).concat(R.counter.map((c, i) => [c, i]).filter(([c]) => c));

function canServe(c) {
  const have = countOf(R.tray.map(t => t.id));
  return Object.entries(countOf(c.order)).every(([k, n]) => (have[k] || 0) >= n);
}

function serve(i) {
  const c = getCust(i);
  if (!c) return;
  const el = document.querySelector(`[data-slot="${i}"]`);
  if (!canServe(c)) {
    const have = countOf(R.tray.map(t => t.id));
    const missing = Object.entries(countOf(c.order)).filter(([k, n]) => (have[k] || 0) < n)
      .map(([k, n]) => `${ic(MENU[k].icon)}${MENU[k].name}×${n - (have[k] || 0)}`).join(', ');
    toast(`아직 쟁반에 없어요: ${missing}`);
    if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    return;
  }
  // 같은 메뉴가 여러 개면 품질 좋은 것부터 낸다
  let qSum = 0;
  for (const k of c.order) {
    let best = -1;
    R.tray.forEach((t, j) => { if (t.id === k && (best < 0 || t.q > R.tray[best].q)) best = j; });
    qSum += R.tray[best].q;
    R.tray.splice(best, 1);
  }
  const q = qSum / c.order.length;
  let pay = c.order.reduce((s, k) => s + menuPrice(k), 0);
  if (c.vip) pay *= 2;
  if (c.deliv) pay = Math.round(pay * 1.3) + 5 + S.day;
  const speed = c.pat / c.max;
  let tip = 0, msg, color = '#4f9d4a';
  if (q < 0.45) {
    pay = Math.ceil(pay / 2);
    S.rep = Math.max(0, S.rep - 2);
    R.combo = 0;
    msg = `😖 맛없어요… +${pay}`;
    color = '#d24b3e';
  } else {
    R.combo++;
    R.stats.maxCombo = Math.max(R.stats.maxCombo, R.combo);
    // 콤보 1당 5%, 최대 +50%
    const comboMult = 1 + Math.min(10, R.combo - 1) * 0.05;
    pay = Math.round(pay * comboMult);
    if (speed > 0.4) tip = Math.ceil(pay * (0.1 + 0.03 * S.up.decor) * q * (0.5 + S.rep / 100) * (q >= 0.95 ? 1.5 : 1) * (isWeekend() ? 1.2 : 1));
    S.rep = Math.min(100, S.rep + (q >= 0.95 ? 2 : 1) * (speed > 0.4 ? 1 : 0.5) + (c.vip ? 1.5 : 0));
    msg = `${c.deliv ? '🛵 ' : q >= 0.95 ? '😍 ' : ''}+${pay + tip}${tip ? ' 💕' : ''}${R.combo >= 2 ? ` 🔥${R.combo}` : ''}`;
    if (c.vip) R.stats.vip++;
    if (c.deliv) R.stats.delivery++;
  }
  c.order.forEach(k => R.stats.sold[k] = (R.stats.sold[k] || 0) + 1);
  S.money += pay + tip;
  S.totalEarned += pay + tip;
  R.stats.served++;
  R.stats.revenue += pay;
  R.stats.tips += tip;
  floatAt(el, msg, color);
  clearCust(i);
  renderDay(true);
  if (R.tutorial) tutTick();
}

// ----- 작업대 -----
function sameParts(a, b) {
  if (a.length !== b.length) return false;
  const ca = countOf(a), cb = countOf(b);
  return Object.keys(ca).every(k => ca[k] === cb[k]);
}
function isSubset(small, big) {
  const cs = countOf(small), cb = countOf(big);
  return Object.keys(cs).every(k => (cb[k] || 0) >= cs[k]);
}
function benchMatch() {
  const b = R.bench;
  if (!b.cup) return null;
  const ids = b.parts.map(p => p.id);
  return unlockedMenu().find(k => MENU[k].cup === b.cup && sameParts(MENU[k].parts, ids)) || null;
}
// 지금 조합으로 더 만들 수 있는 레시피가 남아 있는지
function benchCanGrow() {
  const b = R.bench;
  const ids = b.parts.map(p => p.id);
  return unlockedMenu().some(k => MENU[k].cup === b.cup && MENU[k].parts.length > ids.length && isSubset(ids, MENU[k].parts));
}

function pressPart(id) {
  const g = R.gauge;
  if (g) {
    if (g.part === id && g.mode === 'auto') { finishGauge(); return; }
    if (g.part === id && g.mode === 'mash') {
      g.v += 0.12;
      if (g.v >= 1) { g.v = 1; finishGauge(); } else updateGauge();
      return;
    }
    toast('지금 하던 걸 먼저 끝내세요!');
    return;
  }
  if (R.tutorial) tutTick();
  const st = tut && tut.steps[tut.i];
  if (st && st.only && !st.only.includes(id)) { toast('👆 반짝이는 버튼을 눌러주세요'); return; }
  const P = PARTS[id];
  const b = R.bench;
  if (P.cup) {
    if (b.cup) { toast('이미 컵/접시가 놓여 있어요. 바꾸려면 🗑 버리기'); return; }
    b.cup = id;
    renderBench();
    return;
  }
  if (!b.cup) { toast('먼저 컵이나 접시를 골라주세요'); return; }
  if (b.parts.length >= 5) { toast('더 이상 넣을 수 없어요'); return; }
  if (P.ing && S.stock[P.ing] < 1) { toast(`${ic(ING[P.ing].icon)} ${ING[P.ing].name}이(가) 다 떨어졌어요!`); return; }
  if (P.ing) { S.stock[P.ing]--; renderStock(); }
  if (P.gauge) {
    const w = S.up.equip * 0.025;
    R.gauge = { part: id, mode: P.gauge.mode, speed: P.gauge.speed || 0, v: P.gauge.mode === 'mash' ? 0.12 : 0,
                zone: P.gauge.zone ? [Math.max(0.05, P.gauge.zone[0] - w), Math.min(0.97, P.gauge.zone[1] + w)] : null,
                holding: P.gauge.mode === 'hold' };
    renderBench();
    return;
  }
  b.parts.push({ id, q: 1 });
  afterAdd();
}

function releasePart() {
  const g = R && R.gauge;
  if (g && g.mode === 'hold' && g.holding) finishGauge();
}

function finishGauge(overflow) {
  const g = R.gauge;
  R.gauge = null;
  let q, label;
  if (g.mode === 'mash') { q = 1; label = '완벽!'; }
  else if (overflow) { q = 0.1; label = g.mode === 'auto' ? '탔어요!' : '넘쳤어요!'; }
  else {
    const [a, b] = g.zone;
    const dist = g.v < a ? a - g.v : g.v > b ? g.v - b : 0;
    if (dist === 0) { q = 1; label = '완벽!'; }
    else if (dist <= 0.1) { q = 0.6; label = g.v < a ? '조금 부족' : '조금 많음'; }
    else { q = 0.15; label = g.v < a ? (g.mode === 'auto' ? '덜 익었어요' : '너무 적어요') : '너무 많아요'; }
  }
  R.bench.parts.push({ id: g.part, q });
  floatAt($('build'), `${ic(PARTS[g.part].icon)} ${label}`, q >= 1 ? '#4f9d4a' : q >= 0.6 ? '#e0a526' : '#d24b3e');
  afterAdd();
}

// 레시피가 완성됐고 더 키울 레시피가 없으면 자동으로 쟁반에 올린다
function afterAdd() {
  const m = benchMatch();
  if (m && !benchCanGrow()) completeBench();
  else renderBench();
}

function completeBench() {
  const m = benchMatch();
  if (!m) { toast('레시피와 달라요'); return; }
  if (R.tray.length >= trayCap()) { toast('쟁반이 가득 찼어요! 먼저 서빙하세요'); renderBench(); return; }
  const parts = R.bench.parts;
  const q = parts.reduce((s, p) => s + p.q, 0) / parts.length;
  R.tray.push({ id: m, q });
  if (q >= 0.95) R.stats.perfect++;
  floatAt($('tray'), `${ic(MENU[m].icon)} ${MENU[m].name} 완성!`, '#5e3a1f');
  R.bench = { cup: null, parts: [] };
  renderBench();
  renderDay(true);
  if (R.tutorial) tutTick();
}

function trashBench() {
  if (R.gauge) R.gauge = null;
  if (!R.bench.cup) return;
  if (R.bench.parts.length) R.stats.wasted++;
  R.bench = { cup: null, parts: [] };
  renderBench();
}

function renderBench() {
  const b = R.bench, g = R.gauge;
  const buildEl = $('build');
  const match = benchMatch();
  const bad = b.cup && !match && !benchCanGrow() && !g;
  buildEl.className = 'build' + (bad ? ' bad' : '');
  if (!b.cup) buildEl.innerHTML = `<span class="hint">컵이나 접시를 골라서 시작하세요</span>`;
  else {
    const items = [`<span class="part">${ic(PARTS[b.cup].icon)}</span>`,
      ...b.parts.map(p => `<span class="part">${ic(PARTS[p.id].icon)}<i>${p.q >= 1 ? '⭐' : p.q >= 0.6 ? '👌' : '❌'}</i></span>`)];
    if (g) items.push(`<span class="part" style="opacity:.45">${ic(PARTS[g.part].icon)}</span>`);
    buildEl.innerHTML = items.join('<span class="plus-sign">+</span>');
  }
  const st = $('buildStatus');
  if (bad) { st.textContent = '❌ 레시피에 없는 조합이에요 — 버리고 다시!'; st.style.color = 'var(--bad)'; }
  else if (match) { st.innerHTML = `✅ ${ic(MENU[match].icon)} ${MENU[match].name} 완성 가능`; st.style.color = 'var(--good)'; }
  else if (b.cup) {
    const ids = b.parts.map(p => p.id);
    const cands = unlockedMenu().filter(k => MENU[k].cup === b.cup && isSubset(ids, MENU[k].parts)).map(k => ic(MENU[k].icon));
    st.innerHTML = cands.length ? `만들 수 있는 것: ${cands.join(' ')}` : '';
    st.style.color = 'var(--muted)';
  } else st.textContent = '';
  $('doneBtn').disabled = !match || !!g;

  $('gaugeWrap').classList.toggle('hidden', !g);
  if (g) {
    $('gaugeLbl').textContent = g.mode === 'hold' ? `${PARTS[g.part].name}: 꾹 누르고 있다가 초록 구간에서 떼세요!`
      : g.mode === 'auto' ? `${PARTS[g.part].name}: 노릇노릇해지면(초록 구간) 다시 눌러서 꺼내세요!`
      : `${PARTS[g.part].name}: 빠르게 연타해서 끝까지 갈아주세요!`;
    const z = $('gaugeZone');
    if (g.zone) { z.style.left = g.zone[0] * 100 + '%'; z.style.width = (g.zone[1] - g.zone[0]) * 100 + '%'; z.style.display = ''; }
    else z.style.display = 'none';
    updateGauge();
  }

  const parts = usedParts();
  const cups = parts.filter(p => PARTS[p].cup), rest = parts.filter(p => !PARTS[p].cup);
  const btn = p => {
    const P = PARTS[p];
    const out = P.ing && S.stock[P.ing] < 1;
    const sub = P.gauge ? (P.gauge.mode === 'hold' ? '꾹 누르기' : P.gauge.mode === 'auto' ? '눌러서 굽기' : '연타') : (P.ing ? `재고 ${S.stock[P.ing]}` : '무료');
    return `<button class="pbtn ${P.cup ? 'cup' : ''} ${out ? 'off' : ''} ${g && g.part === p ? 'active' : ''}" data-act="part" data-id="${p}">
      <span class="ico">${ic(P.icon)}</span><span class="nm">${P.name}</span><span class="sub">${sub}</span></button>`;
  };
  $('benchBtns').innerHTML = `<div class="grp-label">컵 / 접시</div><div class="parts">${cups.map(btn).join('')}</div>
    <div class="grp-label">재료 · 조리</div><div class="parts">${rest.map(btn).join('')}</div>`;
  applyHighlight();
}

function updateGauge() {
  const g = R.gauge;
  if (!g) return;
  $('gaugeFill').style.width = g.v * 100 + '%';
  $('gaugeMark').style.left = `calc(${g.v * 100}% - 1px)`;
}

// 알바생: 손님 주문 중 아직 준비되지 않은 메뉴를 하나 만든다 (품질은 보통)
function staffWork() {
  if (R.tray.length >= trayCap()) return;
  const need = {};
  allCusts().forEach(([c]) => c.order.forEach(k => need[k] = (need[k] || 0) + 1));
  R.tray.forEach(t => need[t.id] && need[t.id]--);
  const urgent = allCusts().map(([c]) => c).sort((a, b) => a.pat / a.max - b.pat / b.max);
  for (const c of urgent) for (const k of c.order) {
    if (need[k] > 0 && menuIngs(k).every(i => S.stock[i] >= 1)) {
      menuIngs(k).forEach(i => S.stock[i]--);
      R.tray.push({ id: k, q: 0.7 });
      floatAt($('tray'), `👨‍🍳 ${ic(MENU[k].icon)}`, '#5e3a1f');
      renderStock();
      renderBench();
      return;
    }
  }
}

function update(dt) {
  const g = R.gauge;
  if (g) {
    if (g.mode === 'mash') g.v = Math.max(0, g.v - 0.22 * dt);
    else if (g.mode === 'auto' || g.holding) {
      g.v += g.speed * dt;
      if (g.v >= 1) { g.v = 1; finishGauge(true); }
    }
    updateGauge();
  }
  // 튜토리얼 중에는 시간과 손님 인내심이 멈춘다
  if (R.tutorial) { tutTick(); return; }

  R.t += dt;
  if (!R.closing && R.t >= DAY_LEN) {
    R.closing = true;
    toast('🔔 마감 시간! 남은 손님만 응대하세요');
  }
  if (!R.closing) {
    R.spawnT -= dt;
    if (R.spawnT <= 0) { spawn(); R.spawnT = nextSpawn(); }
    // 배달은 2일차부터
    if (S.day >= 2 && !R.delivery) {
      R.delivT -= dt;
      if (R.delivT <= 0) { spawnDelivery(); R.delivT = 35 + Math.random() * 25; }
    }
  }
  allCusts().forEach(([c, i]) => {
    c.pat -= dt;
    if (c.pat <= 0) {
      floatAt(document.querySelector(`[data-slot="${i}"]`), c.deliv ? '🛵 배달 취소' : '😠 떠남', '#d24b3e');
      clearCust(i);
      R.stats.lost++;
      if (R.combo >= 3) toast(`💔 콤보 ${R.combo} 끊김!`);
      R.combo = 0;
      S.rep = Math.max(0, S.rep - (c.vip ? 5 : c.deliv ? 2 : 3));
    }
  });
  if (S.up.staff > 0) {
    R.staffT += dt;
    if (R.staffT >= 13 - S.up.staff * 3) { R.staffT = 0; staffWork(); }
  }
  if (S.up.robot > 0) {
    R.robotT += dt;
    if (R.robotT >= 1.2) {
      R.robotT = 0;
      const order = allCusts().filter(([c]) => canServe(c))
        .sort((a, b) => a[0].pat / a[0].max - b[0].pat / b[0].max);
      if (order.length) serve(order[0][1]);
    }
  }
  if (R.closing && !allCusts().length) endDay();
}

function renderStock() {
  $('stockBar').innerHTML = usedIngs().map(i =>
    `<span class="stk ${S.stock[i] < 3 ? 'low' : ''}">${ic(ING[i].icon)} ${ING[i].name} ${S.stock[i]}</span>`).join('');
}

function renderDay(force) {
  if (!R) return;
  renderHud();
  const haveAll = countOf(R.tray.map(t => t.id));
  const slots = (R.delivery ? [[R.delivery, 'd']] : []).concat(R.counter.map((c, i) => [c, i]));
  $('counter').innerHTML = slots.map(([c, i]) => {
    if (!c) return `<div class="slot">빈 자리</div>`;
    const have = { ...haveAll };
    const ready = canServe(c);
    const p = c.pat / c.max;
    const col = p > 0.5 ? '#4f9d4a' : p > 0.25 ? '#e0a526' : '#d24b3e';
    const items = c.order.map(k => {
      const got = have[k] > 0;
      if (got) have[k]--;
      return `<span class="${got ? 'got' : ''}">${ic(MENU[k].icon)}</span>`;
    }).join('');
    const names = c.order.length === 1 ? `<small>${MENU[c.order[0]].name}</small>` : '';
    const tag = c.deliv ? '<span class="tag">배달 ×1.3</span>' : c.order.includes(S.special) ? '<span class="tag hot">추천 메뉴</span>' : '';
    return `<div class="slot cust ${ready ? 'ready' : ''} ${c.vip ? 'vip' : ''} ${c.deliv ? 'deliv' : ''}" data-act="serve" data-slot="${i}">
      ${tag}<div class="face">${c.face}</div>
      <div class="bubble">${items}${names}</div>
      <div class="pbar"><div style="width:${p * 100}%;background:${col}"></div></div>
      <small>${ready ? '탭해서 서빙!' : (c.vip ? 'VIP ×2' : '')}</small>
    </div>`;
  }).join('');
  $('trayCount').textContent = `${R.tray.length}/${trayCap()}`;
  $('tray').innerHTML = R.tray.length ? R.tray.map(t => `<span class="titem">${ic(MENU[t.id].icon)}<i>${qualityMark(t.q)}</i></span>`).join('')
    : `<span class="empty">${R.closing ? '마감 중…' : '완성한 음식이 여기에 올라와요'}</span>`;
  $('quests').innerHTML = S.quests.length ? S.quests.map(q => {
    const v = questVal(q, R.stats, false);
    const ok = v >= q.n;
    return `<div class="q ${ok ? 'ok' : ''}"><span>${ok ? '✅' : '📜'} ${questText(q)}</span><span>${q.type === 'nolost' ? (R.stats.lost ? '❌' : '진행 중') : `${v}/${q.n}`}</span></div>`;
  }).join('') : '';
  const cb = $('combo');
  cb.className = R.combo >= 3 ? 'hot' : '';
  cb.innerHTML = `<b>🔥${R.combo}</b>콤보${R.combo >= 2 ? ` +${Math.min(10, R.combo - 1) * 5}%` : ''}`;
  if (force) renderStock();
  applyHighlight();
}

function endDay() {
  const st = R.stats;
  st.wasted += R.tray.length;
  // 의뢰 보상
  const quests = S.quests.map(q => ({ text: questText(q), reward: q.reward, ok: questVal(q, st, true) >= q.n }));
  const questReward = quests.filter(q => q.ok).reduce((s, q) => s + q.reward, 0);
  S.money += questReward;
  S.totalEarned += questReward;
  // 누적 기록 (업적용)
  const L = S.stats;
  L.served += st.served; L.perfect += st.perfect; L.vip += st.vip; L.delivery += st.delivery;
  L.maxCombo = Math.max(L.maxCombo, st.maxCombo);
  L.bestRevenue = Math.max(L.bestRevenue, st.revenue + st.tips);
  const r = rent();
  S.money -= r;
  lastSummary = { ...st, rent: r, day: S.day, quests, questReward };
  S.bestDay = Math.max(S.bestDay, S.day);
  R = null;
  if (S.money < 0) { gameOver(); return; }
  S.day++;
  prepareDay();
  save();
  showNight();
}

// ---------- 밤(준비) ----------
function showNight() {
  $('dayView').classList.add('hidden');
  $('nightView').classList.remove('hidden');
  window.scrollTo(0, 0);
  lastAct = null;
  if (S.tut === 0) tutStart(NIGHT0_TUT);
  else if (S.tut === 1) tutStart(NIGHT1_TUT, () => { S.tut = 2; save(); });
  else renderNight();
}

function upCost(k) { return Math.round(UPS[k].cost(S.up[k])); }

function renderNight() {
  renderHud();
  let html = '';
  if (lastSummary) {
    const s = lastSummary;
    html += `<div class="card"><h2>🌙 ${s.day}일차 영업 결과</h2><div class="sum">
      <span>서빙한 손님</span><span class="v">${s.served}명</span>
      <span>놓친 손님</span><span class="v ${s.lost ? 'minus' : ''}">${s.lost}명</span>
      <span>⭐ 완벽한 메뉴</span><span class="v">${s.perfect}개</span>
      <span>매출</span><span class="v plus">+${fmt(s.revenue)}</span>
      <span>팁</span><span class="v plus">+${fmt(s.tips)}</span>
      ${s.questReward ? `<span>📜 의뢰 보상</span><span class="v plus">+${fmt(s.questReward)}</span>` : ''}
      ${s.maxCombo >= 2 ? `<span>🔥 최고 콤보</span><span class="v">${s.maxCombo}</span>` : ''}
      ${s.delivery ? `<span>🛵 배달 완료</span><span class="v">${s.delivery}건</span>` : ''}
      <span>월세</span><span class="v minus">-${fmt(s.rent)}</span>
      ${s.wasted ? `<span>버린 음식</span><span class="v minus">${s.wasted}개</span>` : ''}
    </div>
    ${s.quests && s.quests.length ? `<div class="info-list" style="margin-top:8px;border-top:1px dashed var(--line);padding-top:6px">
      ${s.quests.map(q => `<div>${q.ok ? '✅' : '❌'} ${q.text} <b class="${q.ok ? 'plus' : ''}" style="float:right">${q.ok ? '+' : ''}${fmt(q.reward)}</b></div>`).join('')}</div>` : ''}
    </div>`;
  } else {
    html += `<div class="card"><h2>☕ 나의 작은 카페</h2>
      <div style="font-size:.9rem;line-height:1.7">손님의 주문을 보고 직접 음료와 디저트를 만들어 파는 카페 경영 게임이에요.
      낮에는 장사를 하고, 밤에는 재료를 사고 가게를 키워요.</div></div>`;
  }
  const lowIngs = usedIngs().filter(i => S.stock[i] < 5);
  html += `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
    <span>내일 월세 <b>${coin(rent())}</b></span>
    ${lowIngs.length ? `<span class="warn-text">재료 부족 ${lowIngs.map(i => ic(ING[i].icon)).join('')}</span>` : ''}
  </div>`;
  html += `<div class="card"><h2>📰 내일 소식 (${S.day}일차)</h2><div class="info-list">
    ${isWeekend() ? `<div>🎉 <b>주말!</b> 손님이 1.4배 몰리고 팁도 1.2배예요</div>` : ''}
    ${S.special ? `<div>⭐ 추천 메뉴: ${ic(MENU[S.special].icon)} <b>${MENU[S.special].name}</b> — 1.5배 가격, 주문 많음</div>` : ''}
    ${S.sale ? `<div>🏷️ 시장 특가: ${ic(ING[S.sale].icon)} <b>${ING[S.sale].name}</b> 오늘 밤 반값!</div>` : ''}
    ${S.day >= 2 ? `<div>🛵 가끔 <b>배달 주문</b>이 들어와요 (1.3배 + 배달비)</div>` : ''}
    ${S.quests.map(q => `<div>📜 ${questText(q)} <b style="float:right">${coin(q.reward)}</b></div>`).join('')}
  </div></div>`;

  const ready = achReady().length;
  const tabs = [['stock', '📦 재료'], ['up', '🔧 업그레이드'], ['menu', '📋 메뉴'], ['shop', '🏪 확장'], ['ach', '🏆 업적']];
  html += `<div class="tabs">${tabs.map(([k, n]) => `<button class="tab ${nightTab === k ? 'on' : ''}" data-act="tab" data-id="${k}">${n}${k === 'ach' && ready ? `<span class="dot">${ready}</span>` : ''}</button>`).join('')}</div>`;
  html += `<div class="card">`;

  if (nightTab === 'stock') {
    const fillCost = usedIngs().reduce((s, i) => s + ingCost(i, Math.max(0, 20 - S.stock[i])), 0);
    html += `<button class="buy" style="width:100%;margin-bottom:6px" data-act="fill" ${fillCost === 0 ? 'disabled' : ''}>🛒 전부 20개까지 채우기 (${coin(fillCost)})</button>`;
    html += usedIngs().map(i => {
      const g = ING[i];
      return `<div class="item"><div class="ico">${ic(g.icon)}</div>
        <div class="info"><b>${g.name} · ${S.stock[i]}개${S.sale === i ? '<span class="sale-tag">반값!</span>' : ''}</b><span>개당 ${coin(g.cost)}${S.sale === i ? ' → 절반' : ''}</span></div>
        <button class="buy" data-act="buy" data-id="${i}" data-n="5" ${S.money < ingCost(i, 5) ? 'disabled' : ''}>+5 (${ingCost(i, 5)})</button>
        <button class="buy" data-act="buy" data-id="${i}" data-n="20" ${S.money < ingCost(i, 20) ? 'disabled' : ''}>+20 (${ingCost(i, 20)})</button>
      </div>`;
    }).join('');
    html += `<div style="font-size:.75rem;color:var(--muted);margin-top:6px">${ic('water')} 물과 ${ic('ice')} 얼음은 공짜예요.</div>`;
  } else if (nightTab === 'up') {
    html += Object.entries(UPS).map(([k, u]) => {
      const lv = S.up[k], max = u.max();
      const atMax = lv >= max;
      const cost = upCost(k);
      let btn;
      if (atMax) btn = `<button class="buy" disabled>${S.shop < 3 ? '확장 필요' : 'MAX'}</button>`;
      else btn = `<button class="buy" data-act="up" data-id="${k}" ${S.money < cost ? 'disabled' : ''}>${coin(cost)}</button>`;
      return `<div class="item"><div class="ico">${u.icon}</div>
        <div class="info"><b>${u.name} <small>(${lv}/${max})</small></b><span>${atMax ? '현재 최대' : u.desc(lv)}</span></div>${btn}</div>`;
    }).join('');
  } else if (nightTab === 'menu') {
    html += Object.entries(MENU).map(([k, m]) => {
      let btn;
      if (S.unlocked[k]) btn = `<button class="buy" disabled>판매 중</button>`;
      else if (S.shop < m.shop) btn = `<button class="buy" disabled>${SHOPS[m.shop].name} 필요</button>`;
      else btn = `<button class="buy" data-act="unlock" data-id="${k}" ${S.money < m.cost ? 'disabled' : ''}>${coin(m.cost)}</button>`;
      return `<div class="item"><div class="ico">${ic(m.icon)}</div>
        <div class="info"><b>${m.name} · ${coin(price(k))}${k === S.special ? '<span class="sale-tag">내일 추천</span>' : ''}</b>${recipeHtml(k)}</div>${btn}</div>`;
    }).join('');
  } else if (nightTab === 'ach') {
    const list = ACHS.slice().sort((a, b) => (!!S.ach[a.id] - !!S.ach[b.id]) || ((b.val() >= b.goal) - (a.val() >= a.goal)));
    html += list.map(a => {
      const v = Math.min(a.goal, a.val()), done = S.ach[a.id], can = !done && v >= a.goal;
      const btn = done ? `<button class="buy" disabled>받음</button>`
        : `<button class="buy" data-act="claim" data-id="${a.id}" ${can ? '' : 'disabled'}>${coin(a.reward)}</button>`;
      return `<div class="item ${done ? 'ach-done' : ''}"><div class="ico">${done ? '🏅' : can ? '🎁' : '🏆'}</div>
        <div class="info"><b>${a.name}</b><span>${a.desc} (${fmt(v)}/${fmt(a.goal)})</span>
        <div class="prog"><div style="width:${v / a.goal * 100}%"></div></div></div>${btn}</div>`;
    }).join('');
  } else {
    const cur = SHOPS[S.shop], nx = SHOPS[S.shop + 1];
    html += `<div class="item"><div class="ico">${cur.icon}</div><div class="info"><b>지금: ${cur.name}</b>
      <span>판매가 ×${cur.priceMult} · 월세 ×${cur.rentMult}</span></div></div>`;
    if (nx) {
      html += `<div class="item"><div class="ico">${nx.icon}</div><div class="info"><b>다음: ${nx.name}</b>
        <span>판매가 ×${nx.priceMult} · 손님 증가 · 업그레이드 한도 증가 · 새 메뉴/알바${S.shop + 1 >= 2 ? '/로봇' : ''} · 월세 ×${nx.rentMult}</span></div>
        <button class="buy" data-act="expand" ${S.money < nx.cost ? 'disabled' : ''}>${coin(nx.cost)}</button></div>`;
    } else {
      html += `<div style="text-align:center;padding:10px">🎉 최고 단계에 도달했어요!</div>`;
    }
    html += `<div style="font-size:.8rem;color:var(--muted);margin-top:8px">누적 수입 ${coin(S.totalEarned)}</div>`;
  }
  html += `</div>`;
  html += `<button class="big" data-act="start">☀️ ${S.day}일차 영업 시작</button>`;
  html += `<div class="links">${S.tut === 2 ? `<button class="reset" data-act="replayTut">📘 튜토리얼 다시 보기</button>` : ''}
    <button class="reset" data-act="reset">처음부터 다시하기</button></div>`;
  $('nightView').innerHTML = html;
  applyHighlight();
}

function buy(i, n) {
  const c = ingCost(i, n);
  if (S.money < c) return;
  S.money -= c;
  S.stock[i] += n;
}

function gameOver() {
  $('dayView').classList.add('hidden');
  const s = lastSummary;
  $('overlay').innerHTML = `<div class="card"><h2>💸 파산했어요…</h2>
    <p>${s.day}일차 월세 ${coin(s.rent)}을 낼 돈이 없었어요.</p>
    <p>누적 수입 ${coin(S.totalEarned)}<br>${SHOPS[S.shop].icon} ${SHOPS[S.shop].name}까지 키웠어요</p>
    <button class="big" data-act="restart">다시 시작</button></div>`;
  $('overlay').classList.remove('hidden');
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

// ---------- 입력 ----------
// 영업 중에는 화면이 계속 다시 그려져서 click이 씹힐 수 있으니 pointerdown으로 받는다.
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !R) return;
  const act = el.dataset.act;
  if (act === 'tutNext') tutAdvance();
  else if (act === 'serve') serve(el.dataset.slot === 'd' ? 'd' : +el.dataset.slot);
  else if (act === 'part') { e.preventDefault(); pressPart(el.dataset.id); }
  else if (act === 'done') completeBench();
  else if (act === 'trash') trashBench();
  else if (act === 'clearTray') {
    if (R.tray.length) { R.stats.wasted += R.tray.length; R.tray = []; renderDay(true); }
  }
});
document.addEventListener('pointerup', releasePart);
document.addEventListener('pointercancel', releasePart);
window.addEventListener('blur', releasePart);
document.addEventListener('contextmenu', e => { if (R) e.preventDefault(); });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || R) return;
  const act = el.dataset.act, id = el.dataset.id;
  lastAct = act;
  if (act === 'tutNext') { tutAdvance(); return; }
  if (act === 'tab') nightTab = id;
  else if (act === 'buy') buy(id, +el.dataset.n);
  else if (act === 'fill') usedIngs().forEach(i => {
    const n = Math.max(0, 20 - S.stock[i]);
    let k = Math.min(n, Math.floor(S.money / (ING[i].cost * (S.sale === i ? 0.5 : 1))));
    while (k > 0 && ingCost(i, k) > S.money) k--;
    buy(i, k);
  });
  else if (act === 'claim') {
    const a = ACHS.find(x => x.id === id);
    if (a && !S.ach[id] && a.val() >= a.goal) {
      S.ach[id] = true;
      S.money += a.reward;
      S.totalEarned += a.reward;
      toast(`🏆 ${a.name} 달성! +${a.reward}`);
    }
  } else if (act === 'up') {
    const c = upCost(id);
    if (S.money >= c && S.up[id] < UPS[id].max()) { S.money -= c; S.up[id]++; toast(`${UPS[id].icon} ${UPS[id].name} 완료!`); }
  } else if (act === 'unlock') {
    const c = MENU[id].cost;
    if (S.money >= c) { S.money -= c; S.unlocked[id] = true; toast(`${ic(MENU[id].icon)} ${MENU[id].name} 판매 시작! 재료를 사두세요`); }
  } else if (act === 'expand') {
    const nx = SHOPS[S.shop + 1];
    if (nx && S.money >= nx.cost) { S.money -= nx.cost; S.shop++; toast(`${nx.icon} ${nx.name}(으)로 확장했어요!`); }
  } else if (act === 'start') { startDay(); return; }
  else if (act === 'replayTut') {
    S.tut = 0; save();
    tutStart(NIGHT0_TUT);
    return;
  } else if (act === 'reset') {
    if (!confirm('정말 처음부터 다시 할까요? 저장된 진행이 사라져요.')) return;
    S = newGame(); lastSummary = null; prepareDay(); save();
    showNight();
    return;
  } else if (act === 'restart') {
    $('overlay').classList.add('hidden');
    S = newGame(); lastSummary = null; prepareDay(); save();
    showNight();
    return;
  } else return;
  save();
  renderNight();
  tutTick();
});

// ---------- 루프 ----------
let last = performance.now(), renderAcc = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (R && !document.hidden) {
    update(dt);
    renderAcc += dt;
    if (R && renderAcc >= 0.1) { renderAcc = 0; renderDay(false); }
  }
  requestAnimationFrame(loop);
}

S = load() || newGame();
if (!S.quests.length) prepareDay();
showNight();
requestAnimationFrame(loop);
</script>
</body>
</html>
