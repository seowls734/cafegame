<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>나의 작은 카페</title>
<style>
  :root {
    --bg: #f6ead8;
    --panel: #fffaf2;
    --wood: #8b5a34;
    --wood-dark: #5e3a1f;
    --ink: #3b2614;
    --muted: #8a7360;
    --accent: #e07b39;
    --good: #4f9d4a;
    --warn: #e0a526;
    --bad: #d24b3e;
    --line: #e4d2b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* HUD */
  #hud {
    position: sticky; top: 0; z-index: 5;
    background: var(--wood-dark); color: #fff3e2;
    padding: 10px 16px 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .hud-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
  .hud-row .money { font-size: 1.15rem; color: #ffd68a; }
  .clock-bar { margin-top: 6px; height: 6px; background: rgba(255,255,255,.18); border-radius: 3px; overflow: hidden; }
  .clock-bar > div { height: 100%; background: #ffd68a; width: 0; }
  .rep { font-size: .9rem; }

  section { padding: 12px 16px 24px; }
  .hidden { display: none !important; }
  h3 { margin: 14px 0 8px; font-size: .95rem; color: var(--wood); }

  /* Counter / customers */
  .shopname { text-align: center; font-weight: 800; color: var(--wood); margin-bottom: 8px; }
  #counter {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px;
    background: linear-gradient(#fff4e3, #f3dfc2);
    border: 3px solid var(--wood); border-radius: 14px; padding: 10px;
    min-height: 150px;
  }
  .slot {
    border: 2px dashed var(--line); border-radius: 12px; min-height: 128px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--muted); font-size: .8rem; padding: 6px 4px;
  }
  .cust { border-style: solid; border-color: var(--wood); background: var(--panel); color: var(--ink); cursor: pointer; }
  .cust.ready { border-color: var(--good); box-shadow: 0 0 0 3px rgba(79,157,74,.3); }
  .cust.vip { background: #fff3c4; }
  .cust .face { font-size: 2rem; line-height: 1; }
  .bubble { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 2px 6px; font-size: 1.3rem; display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
  .bubble .got { background: #d8f0d2; border-radius: 4px; }
  .pbar { width: 86%; height: 6px; background: #eadbc5; border-radius: 3px; overflow: hidden; }
  .pbar > div { height: 100%; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* Tray & machines */
  .row-title { display: flex; justify-content: space-between; align-items: center; }
  .small-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 3px 8px; font-size: .78rem; }
  #tray {
    min-height: 52px; background: #d9b98f; border: 2px solid var(--wood); border-radius: 12px;
    display: flex; gap: 4px; flex-wrap: wrap; align-items: center; padding: 6px 8px; font-size: 1.6rem;
  }
  #tray .empty { font-size: .85rem; color: var(--wood-dark); opacity: .7; }
  #machines { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
  .mach { background: #5b5b5b; color: #fff; border-radius: 10px; padding: 6px; text-align: center; font-size: .75rem; min-height: 60px; }
  .mach .ico { font-size: 1.4rem; }
  .mach .prog { height: 5px; background: #333; border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .mach .prog > div { height: 100%; background: #7fd36f; }
  .mach.idle { background: #8d8d8d; opacity: .7; }
  .mach.done { background: var(--good); }

  /* Menu buttons */
  #menuBtns { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .mbtn {
    background: var(--panel); border: 2px solid var(--wood); border-radius: 12px; padding: 8px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 3px 0 var(--wood);
  }
  .mbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood); }
  .mbtn .ico { font-size: 1.8rem; }
  .mbtn .nm { font-size: .8rem; font-weight: 700; }
  .mbtn .sub { font-size: .7rem; color: var(--muted); }
  .mbtn.off { opacity: .45; }
  #stockBar { display: flex; flex-wrap: wrap; gap: 6px; font-size: .85rem; }
  .stk { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px 7px; }
  .stk.low { border-color: var(--bad); color: var(--bad); font-weight: 700; }

  /* Night */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 8px; font-size: 1.1rem; }
  .sum { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: .9rem; }
  .sum .v { text-align: right; font-weight: 700; }
  .plus { color: var(--good); } .minus { color: var(--bad); }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { flex: 1; border: 2px solid var(--wood); background: var(--panel); border-radius: 10px; padding: 8px 0; font-weight: 700; font-size: .85rem; }
  .tab.on { background: var(--wood); color: #fff; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .ico { font-size: 1.8rem; width: 40px; text-align: center; }
  .item .info { flex: 1; min-width: 0; }
  .item .info b { display: block; }
  .item .info span { font-size: .78rem; color: var(--muted); }
  .buy {
    border: 0; background: var(--accent); color: #fff; font-weight: 700; border-radius: 10px; padding: 8px 10px; font-size: .8rem; white-space: nowrap;
  }
  .buy:disabled { background: #c9b8a6; }
  .big {
    width: 100%; border: 0; border-radius: 14px; padding: 14px; font-size: 1.1rem; font-weight: 800;
    background: var(--accent); color: #fff; box-shadow: 0 4px 0 #a9541f;
  }
  .big:active { transform: translateY(2px); box-shadow: 0 2px 0 #a9541f; }
  .warn-text { color: var(--bad); font-size: .85rem; font-weight: 700; }
  .reset { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: .8rem; margin-top: 18px; }

  /* Overlay, toast, floats */
  #overlay { position: fixed; inset: 0; background: rgba(40,25,10,.7); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  #overlay .card { max-width: 380px; width: 100%; text-align: center; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30;
    background: rgba(40,25,10,.9); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: .9rem;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
  }
  #toast.show { opacity: 1; }
  .float { position: fixed; z-index: 25; font-weight: 800; pointer-events: none; animation: floatUp 1s forwards; text-shadow: 0 1px 2px #fff; }
  @keyframes floatUp { to { transform: translateY(-40px); opacity: 0; } }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-row">
      <span id="hudDay">1일차</span>
      <span class="rep" id="hudRep"></span>
      <span class="money" id="hudMoney"></span>
    </div>
    <div class="clock-bar"><div id="hudClock"></div></div>
  </header>

  <section id="dayView" class="hidden">
    <div class="shopname" id="shopName"></div>
    <div id="counter"></div>
    <h3 class="row-title"><span>🍽️ 쟁반 <small id="trayCount"></small></span><button class="small-btn" data-act="clearTray">🗑 비우기</button></h3>
    <div id="tray"></div>
    <h3>⚙️ 머신</h3>
    <div id="machines"></div>
    <h3>📋 만들기</h3>
    <div id="menuBtns"></div>
    <h3>📦 재고</h3>
    <div id="stockBar"></div>
  </section>

  <section id="nightView" class="hidden"></section>
</div>
<div id="overlay" class="hidden"></div>
<div id="toast"></div>

<script>
'use strict';

// ---------- 데이터 ----------
const ING = {
  bean:   { name: '원두',   icon: '🫘', cost: 1 },
  milk:   { name: '우유',   icon: '🥛', cost: 1 },
  cookie: { name: '쿠키',   icon: '🍪', cost: 1 },
  tea:    { name: '찻잎',   icon: '🌿', cost: 2 },
  cake:   { name: '케이크', icon: '🎂', cost: 4 },
  dough:  { name: '생지',   icon: '🥖', cost: 2 },
  fruit:  { name: '딸기',   icon: '🍓', cost: 3 },
  cocoa:  { name: '코코아', icon: '🟤', cost: 3 },
};

// brew 0 = 바로 쟁반으로, 그 외는 머신에서 만든다.
const MENU = {
  americano: { name: '아메리카노', icon: '☕', need: { bean: 1 },           brew: 3, price: 4,  cost: 0,   shop: 0 },
  latte:     { name: '카페라떼',   icon: '🧋', need: { bean: 1, milk: 1 },  brew: 4, price: 7,  cost: 0,   shop: 0 },
  cookie:    { name: '쿠키',       icon: '🍪', need: { cookie: 1 },         brew: 0, price: 3,  cost: 0,   shop: 0 },
  tea:       { name: '홍차',       icon: '🍵', need: { tea: 1 },            brew: 3, price: 6,  cost: 60,  shop: 0 },
  cake:      { name: '조각케이크', icon: '🍰', need: { cake: 1 },           brew: 0, price: 10, cost: 100, shop: 0 },
  croissant: { name: '크루아상',   icon: '🥐', need: { dough: 1 },          brew: 2, price: 7,  cost: 180, shop: 1 },
  smoothie:  { name: '딸기스무디', icon: '🍹', need: { fruit: 1, milk: 1 }, brew: 5, price: 12, cost: 250, shop: 1 },
  choco:     { name: '핫초코',     icon: '🍫', need: { cocoa: 1, milk: 1 }, brew: 4, price: 11, cost: 400, shop: 2 },
};

const SHOPS = [
  { name: '길거리 노점',     icon: '🛒', cost: 0,    priceMult: 1.0, rentMult: 1.0 },
  { name: '동네 카페',       icon: '🏠', cost: 300,  priceMult: 1.2, rentMult: 1.6 },
  { name: '2층 카페',        icon: '🏢', cost: 1000, priceMult: 1.4, rentMult: 2.5 },
  { name: '프랜차이즈 본점', icon: '🏙️', cost: 3500, priceMult: 1.7, rentMult: 4.0 },
];

const UPS = {
  machine: { name: '머신 추가',   icon: '⚙️', desc: l => `동시에 만드는 수 ${l} → ${l + 1}`,
             max: () => 2 + S.shop, cost: l => 80 * Math.pow(2.2, l - 1) },
  counter: { name: '카운터 확장', icon: '🪑', desc: l => `손님 자리 ${l} → ${l + 1}`,
             max: () => 3 + S.shop, cost: l => 60 * Math.pow(2, l - 2) },
  speed:   { name: '머신 성능',   icon: '⚡', desc: l => `제조 시간 -${Math.round((1 - Math.pow(0.88, l + 1)) * 100)}%`,
             max: () => 2 + S.shop * 2, cost: l => 50 * Math.pow(1.8, l) },
  decor:   { name: '인테리어',    icon: '🪴', desc: l => `손님 인내심·팁 증가 (Lv.${l + 1})`,
             max: () => 1 + S.shop * 2, cost: l => 70 * Math.pow(1.9, l) },
  sign:    { name: '홍보 간판',   icon: '📣', desc: l => `손님이 더 자주 와요 (Lv.${l + 1})`,
             max: () => 1 + S.shop * 2, cost: l => 60 * Math.pow(1.8, l) },
  staff:   { name: '알바생',      icon: '🧑‍🍳', desc: l => `필요한 메뉴를 자동으로 만들어요 (Lv.${l + 1})`,
             max: () => Math.min(3, S.shop), cost: l => 200 * Math.pow(2.5, l) },
  robot:   { name: '서빙 로봇',   icon: '🤖', desc: () => '준비된 주문을 자동으로 서빙해요',
             max: () => (S.shop >= 2 ? 1 : 0), cost: () => 1500 },
};

const FACES = ['🧑', '👩', '👨', '🧓', '👵', '👴', '👧', '👦', '🧑‍🎓', '👩‍💼', '👨‍💼', '🧑‍🎨', '👩‍🔧', '🧑‍💻'];
const DAY_LEN = 100;   // 영업 시간(초)
const TRAY_CAP = 8;
const SAVE_KEY = 'cafeSim_v1';

// ---------- 상태 ----------
let S;          // 저장되는 상태
let R = null;   // 영업 중에만 쓰는 상태
let nightTab = 'stock';
let lastSummary = null;

function newGame() {
  return {
    day: 1, money: 60, rep: 50, shop: 0, totalEarned: 0, bestDay: 0,
    stock: { bean: 12, milk: 6, cookie: 6, tea: 0, cake: 0, dough: 0, fruit: 0, cocoa: 0 },
    unlocked: { americano: true, latte: true, cookie: true },
    up: { machine: 1, counter: 2, speed: 0, decor: 0, sign: 0, staff: 0, robot: 0 },
  };
}

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    const base = newGame();
    return { ...base, ...d, stock: { ...base.stock, ...d.stock }, up: { ...base.up, ...d.up }, unlocked: { ...base.unlocked, ...d.unlocked } };
  } catch (e) { return null; }
}

// ---------- 공통 ----------
const $ = id => document.getElementById(id);
const fmt = n => Math.floor(n).toLocaleString('ko-KR');
const price = id => Math.round(MENU[id].price * SHOPS[S.shop].priceMult);
const brewTime = id => MENU[id].brew * Math.pow(0.88, S.up.speed);
const rent = () => Math.round((8 + S.day * 2) * SHOPS[S.shop].rentMult);
const unlockedMenu = () => Object.keys(MENU).filter(k => S.unlocked[k]);
const usedIngs = () => Object.keys(ING).filter(i => unlockedMenu().some(m => MENU[m].need[i]));
const hasStock = id => Object.entries(MENU[id].need).every(([i, n]) => S.stock[i] >= n);
const countOf = arr => arr.reduce((o, k) => (o[k] = (o[k] || 0) + 1, o), {});

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

function floatAt(el, text, color) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'float';
  f.textContent = text;
  f.style.color = color;
  f.style.left = (r.left + r.width / 2 - 20) + 'px';
  f.style.top = (r.top + 10) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1000);
}

function stars(rep) {
  const n = Math.max(1, Math.round(rep / 20));
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

function renderHud() {
  $('hudDay').textContent = `${S.day}일차 ${R ? '☀️' : '🌙'}`;
  $('hudRep').textContent = `${stars(S.rep)} ${Math.round(S.rep)}`;
  $('hudMoney').textContent = `🪙 ${fmt(S.money)}`;
  const p = R ? Math.min(1, R.t / DAY_LEN) : 0;
  $('hudClock').style.width = (p * 100) + '%';
}

// ---------- 영업(낮) ----------
function startDay() {
  R = {
    t: 0, closing: false,
    counter: Array(S.up.counter).fill(null),
    machines: Array(S.up.machine).fill(null),
    tray: [],
    spawnT: 1.5, staffT: 0, robotT: 0,
    stats: { served: 0, lost: 0, revenue: 0, tips: 0, wasted: 0 },
  };
  $('nightView').classList.add('hidden');
  $('dayView').classList.remove('hidden');
  $('shopName').textContent = `${SHOPS[S.shop].icon} ${SHOPS[S.shop].name} — 영업 중`;
  window.scrollTo(0, 0);
  last = performance.now();
  renderDay(true);
}

function nextSpawn() {
  const rate = 0.6 + S.rep / 100 + S.up.sign * 0.15 + Math.min(S.day, 30) * 0.02 + S.shop * 0.25;
  return (8 / rate) * (0.6 + Math.random() * 0.8);
}

function spawn() {
  const idx = R.counter.indexOf(null);
  if (idx < 0) return; // 자리가 없으면 그냥 지나간다
  const menu = unlockedMenu();
  let size = 1;
  if (Math.random() < Math.min(0.5, 0.08 + S.day * 0.03)) size++;
  if (S.shop >= 2 && Math.random() < 0.15) size++;
  const order = [];
  for (let i = 0; i < size; i++) order.push(menu[Math.floor(Math.random() * menu.length)]);
  const vip = Math.random() < 0.08 + S.up.decor * 0.01;
  const max = (20 + 8 * size) * (1 + S.up.decor * 0.12) * (vip ? 0.7 : 1);
  R.counter[idx] = { face: vip ? '😎' : FACES[Math.floor(Math.random() * FACES.length)], order, pat: max, max, vip };
}

function canServe(c) {
  const have = countOf(R.tray);
  return Object.entries(countOf(c.order)).every(([k, n]) => (have[k] || 0) >= n);
}

function serve(i, auto) {
  const c = R.counter[i];
  if (!c) return;
  const el = document.querySelector(`[data-slot="${i}"]`);
  if (!canServe(c)) {
    const have = countOf(R.tray);
    const need = countOf(c.order);
    const missing = Object.entries(need).filter(([k, n]) => (have[k] || 0) < n)
      .map(([k, n]) => `${MENU[k].icon}×${n - (have[k] || 0)}`).join(' ');
    toast(`쟁반에 부족해요: ${missing}`);
    if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    return;
  }
  for (const k of c.order) R.tray.splice(R.tray.indexOf(k), 1);
  let pay = c.order.reduce((s, k) => s + price(k), 0);
  if (c.vip) pay *= 2;
  const ratio = c.pat / c.max;
  const tip = ratio > 0.5 ? Math.ceil(pay * (0.1 + 0.05 * S.up.decor) * (0.5 + S.rep / 100)) : 0;
  S.money += pay + tip;
  S.totalEarned += pay + tip;
  R.stats.served++;
  R.stats.revenue += pay;
  R.stats.tips += tip;
  S.rep = Math.min(100, S.rep + (ratio > 0.5 ? 1.5 : 0.7) + (c.vip ? 1.5 : 0));
  floatAt(el, `+${pay + tip}${tip ? ' 💕' : ''}`, '#4f9d4a');
  R.counter[i] = null;
  renderDay(true);
}

function make(id, auto) {
  if (!hasStock(id)) { if (!auto) toast(`${MENU[id].name} 재료가 없어요!`); return false; }
  if (MENU[id].brew > 0) {
    const m = R.machines.indexOf(null);
    if (m < 0) { if (!auto) toast('머신이 모두 사용 중이에요'); return false; }
    R.machines[m] = { item: id, t: 0, total: brewTime(id) };
  } else {
    if (R.tray.length >= TRAY_CAP) { if (!auto) toast('쟁반이 가득 찼어요'); return false; }
    R.tray.push(id);
  }
  for (const [i, n] of Object.entries(MENU[id].need)) S.stock[i] -= n;
  renderDay(true);
  return true;
}

// 알바생: 손님 주문 중 아직 준비되지 않은 메뉴를 하나 만든다
function staffWork() {
  const need = {};
  R.counter.forEach(c => c && c.order.forEach(k => need[k] = (need[k] || 0) + 1));
  R.tray.forEach(k => need[k] && need[k]--);
  R.machines.forEach(m => m && need[m.item] && need[m.item]--);
  const urgent = R.counter.filter(Boolean).sort((a, b) => a.pat / a.max - b.pat / b.max);
  for (const c of urgent) for (const k of c.order) {
    if (need[k] > 0 && make(k, true)) return;
  }
}

function update(dt) {
  R.t += dt;
  if (!R.closing && R.t >= DAY_LEN) {
    R.closing = true;
    toast('🔔 마감 시간! 남은 손님만 응대하세요');
  }
  if (!R.closing) {
    R.spawnT -= dt;
    if (R.spawnT <= 0) { spawn(); R.spawnT = nextSpawn(); }
  }
  R.counter.forEach((c, i) => {
    if (!c) return;
    c.pat -= dt;
    if (c.pat <= 0) {
      floatAt(document.querySelector(`[data-slot="${i}"]`), '😠 떠남', '#d24b3e');
      R.counter[i] = null;
      R.stats.lost++;
      S.rep = Math.max(0, S.rep - (c.vip ? 5 : 3));
    }
  });
  R.machines.forEach((m, i) => {
    if (!m) return;
    m.t += dt;
    if (m.t >= m.total && R.tray.length < TRAY_CAP) {
      R.tray.push(m.item);
      R.machines[i] = null;
    }
  });
  if (S.up.staff > 0) {
    R.staffT += dt;
    if (R.staffT >= 5.5 - S.up.staff * 1.3) { R.staffT = 0; staffWork(); }
  }
  if (S.up.robot > 0) {
    R.robotT += dt;
    if (R.robotT >= 1.2) {
      R.robotT = 0;
      const order = R.counter.map((c, i) => [c, i]).filter(([c]) => c && canServe(c))
        .sort((a, b) => a[0].pat / a[0].max - b[0].pat / b[0].max);
      if (order.length) serve(order[0][1], true);
    }
  }
  if (R.closing && R.counter.every(c => !c)) endDay();
}

function renderDay(force) {
  if (!R) return;
  renderHud();
  // 손님
  const cHtml = R.counter.map((c, i) => {
    if (!c) return `<div class="slot">빈 자리</div>`;
    const have = countOf(R.tray);
    const ready = canServe(c);
    const p = c.pat / c.max;
    const col = p > 0.5 ? '#4f9d4a' : p > 0.25 ? '#e0a526' : '#d24b3e';
    const items = c.order.map(k => {
      const got = have[k] > 0;
      if (got) have[k]--;
      return `<span class="${got ? 'got' : ''}">${MENU[k].icon}</span>`;
    }).join('');
    return `<div class="slot cust ${ready ? 'ready' : ''} ${c.vip ? 'vip' : ''}" data-act="serve" data-slot="${i}">
      <div class="face">${c.face}</div>
      <div class="bubble">${items}</div>
      <div class="pbar"><div style="width:${p * 100}%;background:${col}"></div></div>
      <small>${ready ? '탭해서 서빙!' : (c.vip ? 'VIP ×2' : '')}</small>
    </div>`;
  }).join('');
  $('counter').innerHTML = cHtml;
  // 쟁반
  $('trayCount').textContent = `${R.tray.length}/${TRAY_CAP}`;
  $('tray').innerHTML = R.tray.length ? R.tray.map(k => `<span>${MENU[k].icon}</span>`).join('')
    : `<span class="empty">${R.closing ? '마감 중…' : '만든 음식이 여기에 올라와요'}</span>`;
  // 머신
  $('machines').innerHTML = R.machines.map(m => {
    if (!m) return `<div class="mach idle"><div class="ico">⚙️</div>대기</div>`;
    const done = m.t >= m.total;
    return `<div class="mach ${done ? 'done' : ''}"><div class="ico">${MENU[m.item].icon}</div>
      ${done ? '쟁반 가득!' : Math.ceil(m.total - m.t) + '초'}
      <div class="prog"><div style="width:${Math.min(100, m.t / m.total * 100)}%"></div></div></div>`;
  }).join('');
  // 메뉴 & 재고 (상태가 바뀔 때만)
  if (force) {
    $('menuBtns').innerHTML = unlockedMenu().map(k => {
      const m = MENU[k];
      const ok = hasStock(k);
      return `<button class="mbtn ${ok ? '' : 'off'}" data-act="make" data-id="${k}">
        <span class="ico">${m.icon}</span><span class="nm">${m.name}</span>
        <span class="sub">${ok ? `🪙${price(k)} · ${m.brew ? brewTime(k).toFixed(1) + '초' : '바로'}` : '재료 부족'}</span>
      </button>`;
    }).join('');
    $('stockBar').innerHTML = usedIngs().map(i =>
      `<span class="stk ${S.stock[i] < 3 ? 'low' : ''}">${ING[i].icon} ${S.stock[i]}</span>`).join('');
  }
}

function endDay() {
  const st = R.stats;
  st.wasted = R.tray.length + R.machines.filter(Boolean).length;
  const r = rent();
  S.money -= r;
  lastSummary = { ...st, rent: r, day: S.day };
  S.bestDay = Math.max(S.bestDay, S.day);
  R = null;
  if (S.money < 0) { gameOver(); return; }
  S.day++;
  save();
  showNight();
}

// ---------- 밤(준비) ----------
function showNight() {
  $('dayView').classList.add('hidden');
  $('nightView').classList.remove('hidden');
  renderNight();
  window.scrollTo(0, 0);
}

function upCost(k) { return Math.round(UPS[k].cost(S.up[k])); }

function renderNight() {
  renderHud();
  let html = '';
  if (lastSummary) {
    const s = lastSummary;
    html += `<div class="card"><h2>🌙 ${s.day}일차 영업 결과</h2><div class="sum">
      <span>서빙한 손님</span><span class="v">${s.served}명</span>
      <span>놓친 손님</span><span class="v ${s.lost ? 'minus' : ''}">${s.lost}명</span>
      <span>매출</span><span class="v plus">+${fmt(s.revenue)}</span>
      <span>팁</span><span class="v plus">+${fmt(s.tips)}</span>
      <span>월세</span><span class="v minus">-${fmt(s.rent)}</span>
      ${s.wasted ? `<span>버린 음식</span><span class="v minus">${s.wasted}개</span>` : ''}
    </div></div>`;
  } else {
    html += `<div class="card"><h2>☕ 나의 작은 카페</h2>
      <div style="font-size:.9rem;line-height:1.6">낮에는 손님 주문을 보고 메뉴를 만들어 <b>쟁반</b>에 올린 뒤, 손님을 탭해서 서빙하세요.<br>
      밤에는 재료를 사고 가게를 업그레이드하세요. 매일 밤 <b>월세</b>를 못 내면 파산이에요!</div></div>`;
  }
  const lowIngs = usedIngs().filter(i => S.stock[i] < 5);
  html += `<div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <span>내일 월세 <b>🪙${fmt(rent())}</b></span>
    ${lowIngs.length ? `<span class="warn-text">재료 부족: ${lowIngs.map(i => ING[i].icon).join('')}</span>` : ''}
  </div>`;

  const tabs = [['stock', '📦 재료'], ['up', '🔧 업그레이드'], ['menu', '📋 메뉴'], ['shop', '🏪 확장']];
  html += `<div class="tabs">${tabs.map(([k, n]) => `<button class="tab ${nightTab === k ? 'on' : ''}" data-act="tab" data-id="${k}">${n}</button>`).join('')}</div>`;
  html += `<div class="card">`;

  if (nightTab === 'stock') {
    const fillCost = usedIngs().reduce((s, i) => s + Math.max(0, 20 - S.stock[i]) * ING[i].cost, 0);
    html += `<button class="buy" style="width:100%;margin-bottom:6px" data-act="fill" ${fillCost === 0 ? 'disabled' : ''}>🛒 전부 20개까지 채우기 (🪙${fmt(fillCost)})</button>`;
    html += usedIngs().map(i => {
      const g = ING[i];
      return `<div class="item"><div class="ico">${g.icon}</div>
        <div class="info"><b>${g.name} · ${S.stock[i]}개</b><span>개당 🪙${g.cost}</span></div>
        <button class="buy" data-act="buy" data-id="${i}" data-n="5" ${S.money < g.cost * 5 ? 'disabled' : ''}>+5 (${g.cost * 5})</button>
        <button class="buy" data-act="buy" data-id="${i}" data-n="20" ${S.money < g.cost * 20 ? 'disabled' : ''}>+20 (${g.cost * 20})</button>
      </div>`;
    }).join('');
  } else if (nightTab === 'up') {
    html += Object.entries(UPS).map(([k, u]) => {
      const lv = S.up[k], max = u.max();
      const atMax = lv >= max;
      const cost = upCost(k);
      let btn;
      if (atMax) btn = `<button class="buy" disabled>${S.shop < 3 ? '확장 필요' : 'MAX'}</button>`;
      else btn = `<button class="buy" data-act="up" data-id="${k}" ${S.money < cost ? 'disabled' : ''}>🪙${fmt(cost)}</button>`;
      return `<div class="item"><div class="ico">${u.icon}</div>
        <div class="info"><b>${u.name} <small>(${lv}/${max})</small></b><span>${atMax ? '현재 최대' : u.desc(lv)}</span></div>${btn}</div>`;
    }).join('');
  } else if (nightTab === 'menu') {
    html += Object.entries(MENU).map(([k, m]) => {
      const need = Object.keys(m.need).map(i => ING[i].icon).join('');
      let btn;
      if (S.unlocked[k]) btn = `<button class="buy" disabled>판매 중</button>`;
      else if (S.shop < m.shop) btn = `<button class="buy" disabled>${SHOPS[m.shop].name} 필요</button>`;
      else btn = `<button class="buy" data-act="unlock" data-id="${k}" ${S.money < m.cost ? 'disabled' : ''}>🪙${fmt(m.cost)}</button>`;
      return `<div class="item"><div class="ico">${m.icon}</div>
        <div class="info"><b>${m.name}</b><span>판매가 🪙${price(k)} · 재료 ${need} · ${m.brew ? m.brew + '초' : '바로'}</span></div>${btn}</div>`;
    }).join('');
  } else {
    const cur = SHOPS[S.shop], nx = SHOPS[S.shop + 1];
    html += `<div class="item"><div class="ico">${cur.icon}</div><div class="info"><b>지금: ${cur.name}</b>
      <span>판매가 ×${cur.priceMult} · 월세 ×${cur.rentMult}</span></div></div>`;
    if (nx) {
      html += `<div class="item"><div class="ico">${nx.icon}</div><div class="info"><b>다음: ${nx.name}</b>
        <span>판매가 ×${nx.priceMult} · 손님 증가 · 업그레이드 한도 증가 · 새 메뉴/알바${S.shop + 1 >= 2 ? '/로봇' : ''} · 월세 ×${nx.rentMult}</span></div>
        <button class="buy" data-act="expand" ${S.money < nx.cost ? 'disabled' : ''}>🪙${fmt(nx.cost)}</button></div>`;
    } else {
      html += `<div style="text-align:center;padding:10px">🎉 최고 단계에 도달했어요!</div>`;
    }
    html += `<div style="font-size:.8rem;color:var(--muted);margin-top:8px">누적 수입 🪙${fmt(S.totalEarned)}</div>`;
  }
  html += `</div>`;
  html += `<button class="big" data-act="start">☀️ ${S.day}일차 영업 시작</button>`;
  html += `<div style="text-align:center"><button class="reset" data-act="reset">처음부터 다시하기</button></div>`;
  $('nightView').innerHTML = html;
}

function buy(i, n) {
  const c = ING[i].cost * n;
  if (S.money < c) return;
  S.money -= c;
  S.stock[i] += n;
}

function gameOver() {
  $('dayView').classList.add('hidden');
  const s = lastSummary;
  $('overlay').innerHTML = `<div class="card"><h2>💸 파산했어요…</h2>
    <p>${s.day}일차 월세 🪙${fmt(s.rent)}을 낼 돈이 없었어요.</p>
    <p>누적 수입 🪙${fmt(S.totalEarned)}<br>${SHOPS[S.shop].icon} ${SHOPS[S.shop].name}까지 키웠어요</p>
    <button class="big" data-act="restart">다시 시작</button></div>`;
  $('overlay').classList.remove('hidden');
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

// ---------- 입력 ----------
// 영업 중에는 화면이 계속 다시 그려져서 click이 씹힐 수 있으니 pointerdown으로 받는다.
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !R) return;
  const act = el.dataset.act;
  if (act === 'serve') serve(+el.dataset.slot);
  else if (act === 'make') make(el.dataset.id);
  else if (act === 'clearTray') {
    if (R.tray.length) { R.stats.wasted += R.tray.length; R.tray = []; renderDay(true); }
  }
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || R) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'tab') nightTab = id;
  else if (act === 'buy') buy(id, +el.dataset.n);
  else if (act === 'fill') usedIngs().forEach(i => {
    const n = Math.max(0, 20 - S.stock[i]);
    const afford = Math.floor(S.money / ING[i].cost);
    buy(i, Math.min(n, afford));
  });
  else if (act === 'up') {
    const c = upCost(id);
    if (S.money >= c && S.up[id] < UPS[id].max()) { S.money -= c; S.up[id]++; toast(`${UPS[id].icon} ${UPS[id].name} 완료!`); }
  } else if (act === 'unlock') {
    const c = MENU[id].cost;
    if (S.money >= c) { S.money -= c; S.unlocked[id] = true; toast(`${MENU[id].icon} ${MENU[id].name} 판매 시작! 재료를 사두세요`); }
  } else if (act === 'expand') {
    const nx = SHOPS[S.shop + 1];
    if (nx && S.money >= nx.cost) { S.money -= nx.cost; S.shop++; toast(`${nx.icon} ${nx.name}(으)로 확장했어요!`); }
  } else if (act === 'start') { startDay(); return; }
  else if (act === 'reset') {
    if (!confirm('정말 처음부터 다시 할까요? 저장된 진행이 사라져요.')) return;
    S = newGame(); lastSummary = null;
  } else if (act === 'restart') {
    $('overlay').classList.add('hidden');
    S = newGame(); lastSummary = null;
    showNight();
  } else return;
  save();
  renderNight();
});

// ---------- 루프 ----------
let last = performance.now(), renderAcc = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (R && !document.hidden) {
    update(dt);
    renderAcc += dt;
    if (R && renderAcc >= 0.1) { renderAcc = 0; renderDay(false); }
  }
  requestAnimationFrame(loop);
}

S = load() || newGame();
showNight();
requestAnimationFrame(loop);
</script>
</body>
</html>
